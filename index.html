  // =====================================================================
  //  SALVATAGGIO E OFFLINE
  // =====================================================================
  function salva() {
    if (!G) return;
    if (!isFinite(G.banane)) G.banane = 1e300;
    if (!isFinite(G.cuccioli)) G.cuccioli = 1e200;
    G.ts = Date.now();
    try { localStorage.setItem(CHIAVE_SALVATAGGIO, JSON.stringify(G)); } catch (e) {}
  }
  function carica() {
    try {
      const raw = localStorage.getItem(CHIAVE_SALVATAGGIO);
      return raw ? prepara(JSON.parse(raw)) : null;
    } catch (e) { return null; }
  }
  // completa e aggiorna un salvataggio (locale o online) alla versione attuale del gioco
  function prepara(dati) {
    try {
      if (!dati || typeof dati !== "object") return null;
      const base = statoIniziale();
      const g = { ...base, ...dati, liv: { ...base.liv, ...(dati.liv || {}) }, imp: { ...base.imp, ...(dati.imp || {}) } };
      // impostazioni audio delle versioni precedenti
      if (dati.audio && !dati.imp) {
        g.imp.musica = dati.audio.musica === false ? 0 : 70;
        g.imp.effetti = dati.audio.effetti === false ? 0 : 80;
      }
      delete g.audio; delete g.calamai; delete g.traguardiVisti;
      if (!LINGUE[g.imp.lingua]) g.imp.lingua = "it";
      if (!TEMI.some(x => x.id === g.imp.tema)) g.imp.tema = "giungla";
      // record delle opere tradotte: prima erano tutti nella lingua originale
      for (const k of Object.keys(g.archivio)) {
        const o = OPERE.find(x => x.id === k);
        if (o && o.testi) { g.archivio[k + "@" + o.orig] = g.archivio[k]; delete g.archivio[k]; }
      }
      if (!g.linguaOpera) { const o = OPERE.find(x => x.id === g.operaId); g.linguaOpera = o && o.orig ? o.orig : g.imp.lingua; }
      if (dati.tutorialFatto === undefined) g.tutorialFatto = true;
      // prima valevano anche parole a caso: ora contano solo le parole della frase
      // le parole ora contano solo nell'ordine della frase: azzero quelle trovate prima
      if (!dati.paroleInOrdine) { g.parole = 0; g.parolaMax = null; g.paroleModo = {}; g.diario = (g.diario || []).filter(v => v.tipo !== "parola"); }
      g.paroleInOrdine = true;
      // frasi completate divise per difficoltà
      if (!dati.frasiModo) {
        g.frasiModo = { facile: {}, normale: {}, realistica: {} };
        for (const [id, l] of Object.entries(g.lunghe || {})) {
          const m = (g.lungheModo || {})[id] || "normale";
          g.frasiModo[m][id] = Math.max(g.frasiModo[m][id] || 0, l);
        }
        if (g.fraseMio) g.frasiModo[g.fraseMioModo || "normale"].mio = g.fraseMio;
      }
      // prima si partiva con 5 scimmie gratis: nei salvataggi vecchi diventano 5 scimmie comprate
      if (!dati.ufficioVuoto) { g.liv.s0 = (g.liv.s0 || 0) + 5; g.ufficioVuoto = true; }
      let vecchioMolt = 1, aveva = false;
      for (const [id, molt] of Object.entries(VECCHI_UNICI_VEL)) {
        if (g.liv[id]) { vecchioMolt *= molt; aveva = true; }
        delete g.liv[id];
      }
      if (aveva) {
        // stessi tasti al secondo di prima: base × vecchio moltiplicatore = base + tasti degli oggetti
        let resto = VELOCITA_BASE * (vecchioMolt - 1);
        for (let k = OGGETTI.length - 1; k >= 0; k--) {
          const [id, , agg] = OGGETTI[k];
          const n = Math.min(400, Math.floor(resto / agg));
          if (n > 0) { g.liv[id] = (g.liv[id] || 0) + n; resto -= n * agg; }
        }
        g.convertitoVel = true;
      }
      if (dati.raccolto === undefined) { g.raccolto = g.banane; g.lettere = g.banane; }
      g.lunghe = g.lunghe || {};
      g.lungheModo = g.lungheModo || {};
      if (!MODI.includes(g.imp.modo)) g.imp.modo = "normale";
      if (!MODI.includes(g.modoOpera)) g.modoOpera = "normale";
      for (const id of g.opereFatte) if (!g.lunghe[id]) { const o = OPERE.find(x => x.id === id); if (o) g.lunghe[id] = normalizza(o.testo, "normale").length; }
      if (g.record && !g.recordTs) g.recordTs = Date.now();
      for (const v of g.diario) if (v.quando < 1e12) v.quando = Date.now();
      for (const id of Object.keys(g.traguardi)) {
        if (!TRAGUARDI.some(tr => tr.id === id)) delete g.traguardi[id];
        else if (typeof g.traguardi[id] !== "object") g.traguardi[id] = { r: false };
      }
      return g;
    } catch (e) { return null; }
  }

  // calcola cosa è successo mentre il gioco era chiuso; il riepilogo appare dopo "Gioca"
  function progressiOffline() {
    const assente = Math.min(oreOffline() * 3600, (Date.now() - (G.ts || Date.now())) / 1000);
    if (assente < 60 || R.fermo) return;
    const g = crescitaAlSecondo();
    const tps = tastiAlSecondo();
    const N0 = numScimmie();
    const tasti = tps * (g > 0 ? Math.expm1(g * assente) / g : assente);
    const banane = bananeAlSecondo(tasti) * efficienzaNotte();
    if (g > 0) G.cuccioli *= Math.exp(g * assente);
    G.tasti += tasti;
    raccogli(banane);
    const ritorno = { assente, banane, tasti, nuove: g > 0 ? numScimmie() - N0 : 0, record: 0 };
    const migliore = serieMassimaSuTasti(tasti);
    if (migliore > G.record) {
      ritorno.record = Math.min(migliore, R.target.length);
      nuovoRecord(migliore, idCasuale(numScimmie()), Date.now() - Math.random() * assente * 1000);
    }
    if (!R.fermo) R.ritorno = ritorno;
  }

    const r = R.ritorno;
    if (!r) return;
    const righe = [t("rit_banane", { n: fmt(r.banane) }), t("rit_tasti", { n: fmt(r.tasti) })];
    if (r.nuove >= 1) righe.push(t("rit_nuove", { n: fmt(r.nuove) }));
    righe.push(r.record ? t("rit_record", { car: caratteri(r.record) }) : t("rit_norecord", { r: G.record, l: R.target.length }));

    $("righeRitorno").innerHTML = righe.map(x => `<span>${x}</span>`).join("");
  }

    return 0.2126 * r + 0.7152 * g + 0.0722 * b;

  function caricaScript(src) {

      document.head.appendChild(sc);
    });

        }
        const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);

          } catch (e) {}

    async collegaFirebase(cfg) {

    rigaModo(m) {

      for (const [id, l] of Object.entries((G.frasiModo || {})[m] || {})) if (l > frase) { frase = l; fraseId = id; }

  function inBase64(byte) {
    let bin = "";
    for (let i = 0; i < byte.length; i += 0x8000) bin += String.fromCharCode.apply(null, byte.subarray(i, i + 0x8000));
    return btoa(bin);
  }
  function daBase64(testo) {
    const bin = atob(testo);
    const byte = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) byte[i] = bin.charCodeAt(i);
    return byte;
  }
  async function codicePartita() {
    // senza compressione: così il codice si legge su qualsiasi telefono e browser
    const json = JSON.stringify({ ...G, diario: (G.diario || []).slice(0, 15), ts: Date.now() });
    return "SCIMMIE1:" + inBase64(new TextEncoder().encode(json));
  }
  async function leggiCodicePartita(testo) {
    // accetta il codice anche se incollato insieme ad altro testo (per esempio da WhatsApp o dalle Note)
    const pulito = (testo || "").replace(/\s+/g, "");
    const trovato = pulito.match(/SCIMMIE[Z1]:[A-Za-z0-9+\/=]+/);
    if (!trovato) throw new Error("codice non valido");
    const codice = trovato[0];
    if (codice.startsWith("SCIMMIEZ:")) {
      const flusso = new Blob([daBase64(codice.slice(9))]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
      return JSON.parse(await new Response(flusso).text());
    }
    if (codice.startsWith("SCIMMIE1:")) return JSON.parse(new TextDecoder().decode(daBase64(codice.slice(9))));
    throw new Error("codice non valido");
  }

    document.documentElement.lang = L;
    document.title = t("gioco");
    document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t(el.dataset.t); });
    document.querySelectorAll("[data-t-ph]").forEach(el => { el.placeholder = t(el.dataset.tPh); });
    document.querySelectorAll("[data-t-aria]").forEach(el => { el.setAttribute("aria-label", t(el.dataset.tAria)); });
    if (R) {
      if (R.target && !R.fermo && normalizza(operaCorrente().testo) !== R.target) caricaOpera();
      else if (R.target) scriviTitoloOpera();
      R.diarioSporco = true;
      scriviFinestraFine();
      scriviRitorno();
      disegnaTraguardi();
      disegnaNegozio();
      scriviImpostazioni();
      scriviMenuIniziale();
      if (aperto("veloBiblioteca")) disegnaBiblioteca();
      if (passoTut >= 0) mostraPassoTut();
      Online.disegna();
      for (const sch of R.schede) {
        const cv = sch.el.querySelector("canvas");
        if (cv && cv.setAttribute) cv.setAttribute("aria-label", t("aria_scrivania", { id: fmtId(sch.id) }));
      }
      disegnaTutto(true);
    }
  }

  function segnaQuantita() {
    document.querySelectorAll(".quantita button").forEach(x => x.setAttribute("aria-pressed", x.dataset.q === G.qta));
  }

  function collegaComandi() {
    // l'audio parte al primo tocco (i browser non permettono di farlo prima)
    const sblocca = () => Suono.sblocca();
    for (const ev of ["pointerdown", "touchend", "click", "keydown"]) document.addEventListener(ev, sblocca, true);
    // suono dei pulsanti (acquisti e premi hanno i loro)
    document.addEventListener("click", e => {
      const b = e.target.closest && e.target.closest("button");
      if (!b || b.classList.contains("pot") || b.classList.contains("riscuoti") || b.classList.contains("riscuoti-tutto")) return;
      Suono.clic();
    });

    // schermata iniziale
    $("bGioca").onclick = gioca;
    $("bMiImpostazioni").onclick = apriImpostazioni;
    $("bMiLingua").onclick = apriLingue;

    // menu e negozio
    document.querySelectorAll(".menu button").forEach(b => b.onclick = () => mostraVista(b.dataset.vista));
    document.querySelectorAll(".segmenti button[data-gruppo]").forEach(b => b.onclick = () => mostraGruppo(b.dataset.gruppo));
    document.querySelectorAll(".quantita button").forEach(b => b.onclick = () => {
      G.qta = b.dataset.q; segnaQuantita(); disegnaNegozio();
    });

    // biblioteca e opere
    $("bApriBiblioteca").onclick = () => { disegnaBiblioteca(); apri("veloBiblioteca"); };
    $("bChiudiBiblioteca").onclick = chiudiBiblioteca;
    $("veloBiblioteca").onclick = e => { if (e.target.id === "veloBiblioteca") chiudiBiblioteca(); };
    $("bMio").onclick = () => {
      const testo = $("testoMio").value;
      if (!normalizza(testo)) { avviso(t("mio_vuoto")); return; }
      iniziaOpera("mio", testo);
      mostraVista("opera");
    };
    $("bProssima").onclick = () => { iniziaOpera(R.prossima); mostraVista("opera"); };
    $("bScegli").onclick = () => { chiudi("veloFine"); disegnaBiblioteca(); apri("veloBiblioteca"); };
    $("bRaccogli").onclick = () => { chiudi("veloRitorno"); R.ritorno = null; Suono.moneta(); };

    // traguardi
    $("bRiscuotiTutto").onclick = () => {
      let tot = 0;
      for (const tr of daRiscuotere()) tot += riscuoti(tr);
      if (tot) { Suono.moneta(); avviso(t("riscosso", { n: fmt(tot) })); }
      disegnaTraguardi(); disegnaBadge();
    };

    // scheda della singola scimmia
    $("bChiudiScimmia").onclick = chiudiScimmia;
    $("veloScimmia").onclick = e => { if (e.target.id === "veloScimmia") chiudiScimmia(); };

    // impostazioni
    $("bImpostazioni").onclick = apriImpostazioni;
    $("bChiudiImpostazioni").onclick = () => chiudi("veloImpostazioni");
    $("veloImpostazioni").onclick = e => { if (e.target.id === "veloImpostazioni") chiudi("veloImpostazioni"); };
    $("volMusica").oninput = e => { G.imp.musica = +e.target.value; scriviImpostazioni(); Suono.sblocca(); };
    $("volEffetti").oninput = e => { G.imp.effetti = +e.target.value; scriviImpostazioni(); Suono.sblocca(); };
    $("volMusica").onchange = salva;
    $("volEffetti").onchange = () => { salva(); Suono.clic(); };
    $("bImpLingua").onclick = apriLingue;
    $("bInfoBanane").onclick = () => apri("veloInfo");
    $("bNomeOk").onclick = confermaNome;
    $("campoNome").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); confermaNome(); } });
    $("bEsporta").onclick = () => { chiudi("veloImpostazioni"); apriEsporta(); };
    $("bImporta").onclick = () => { chiudi("veloImpostazioni"); apriImporta(); };
    $("bTrasfAzione").onclick = azioneTrasferimento;
    $("bTrasfChiudi").onclick = () => chiudi("veloTrasferisci");
    $("veloTrasferisci").onclick = e => { if (e.target.id === "veloTrasferisci") chiudi("veloTrasferisci"); };
    $("bChiudiInfo").onclick = () => chiudi("veloInfo");
    $("veloInfo").onclick = e => { if (e.target.id === "veloInfo") chiudi("veloInfo"); };
    $("bInstalla").onclick = () => { chiudi("veloImpostazioni"); apriInstalla(); };
    $("bInstFatto").onclick = () => { segnaInstallaVisto(); chiudi("veloInstalla"); };
    $("bInstDopo").onclick = () => { segnaInstallaVisto(); chiudi("veloInstalla"); };
    $("bInstallaOra").onclick = async () => {
      if (!promptInstalla) return;
      promptInstalla.prompt();
      try { await promptInstalla.userChoice; } catch (e) {}
      promptInstalla = null;
      segnaInstallaVisto();
      chiudi("veloInstalla");
    };
    $("intro").onclick = chiudiIntro;
    $("bTutAvanti").onclick = avanzaTut;
    $("bTutorial").onclick = () => {
      chiudi("veloImpostazioni");
      if (R.nelMenu) { Suono.sblocca(); $("menuIniziale").hidden = true; R.nelMenu = false; $("bMenuPrincipale").hidden = false; }
      avviaTutorial();
    };
    window.addEventListener("resize", posizionaTut);
    document.querySelectorAll(".segmenti.modi button").forEach(b => b.onclick = () => impostaModo(b.dataset.modo));
    $("bImpTema").onclick = apriTemi;
    $("bChiudiTema").onclick = () => chiudi("veloTema");
    $("veloTema").onclick = e => { if (e.target.id === "veloTema") chiudi("veloTema"); };
    $("bMenuPrincipale").onclick = mostraMenuIniziale;
    $("bAzzera").onclick = () => {
      chiudi("veloImpostazioni");
      chiedi(t("reset_tit"), t("reset_testo"), () => {
        const imp = G.imp;
        try { localStorage.removeItem(CHIAVE_SALVATAGGIO); } catch (e) {}
        $("testoMio").value = "";
        const nuovo = statoIniziale();
        nuovo.imp = imp;
        avvia(nuovo);
        salva();
        mostraVista("opera");
        if (R.nelMenu) scriviMenuIniziale();
        else avviaTutorial();
        avviso(t("reset_ok"));
      });
    };

    // classifica
    document.querySelectorAll("[data-clmodo]").forEach(bt => bt.onclick = () => { Online.modoVista = bt.dataset.clmodo; Online.disegna(); });
    document.querySelectorAll('[data-cl="salva"]').forEach(bt => bt.onclick = () => {
      const campo = bt.parentNode.querySelector('[data-cl="nick"]');
      G.nick = campo.value.trim().slice(0, 20);
      salva();
      Online.pubblicaRiga();
      Online.disegna();
      avviso(t("cl_salvato"));
    });

    // lingua
    $("bChiudiLingua").onclick = () => chiudi("veloLingua");
    $("veloLingua").onclick = e => { if (e.target.id === "veloLingua") chiudi("veloLingua"); };

    // conferme
    $("bConfermaSi").onclick = () => { chiudi("veloConferma"); const f = azioneConferma; azioneConferma = null; if (f) f(); };
    $("bConfermaNo").onclick = () => { chiudi("veloConferma"); azioneConferma = null; };

    window.addEventListener("beforeunload", salva);
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) { salva(); Online.salvaOnline(); Suono.sospendi(); }
    });
  }

  const vistaAttiva = id => $("v-" + id).classList.contains("attiva");
  function disegnaTutto(forza) {
    disegnaHud();
    if (vistaAttiva("opera")) disegnaOpera();
    if (vistaAttiva("negozio")) disegnaNegozio();
    if (vistaAttiva("scimmie")) disegnaScimmie();
    if (vistaAttiva("diario")) {
      disegnaStatistiche();
      if (R.diarioSporco || forza) { disegnaCronaca(); R.diarioSporco = false; }
    }
  }

  function avvia(stato) {
    G = stato;
    const nelMenu = R ? R.nelMenu : true;
    R = {
      cam: [], capo: { id: 1, k: 0, resto: 0 }, target: "", codici: null, fail: null,
      fermo: false, vincitrice: 0, gruppo: R ? R.gruppo : "scimmie", caricamento: true, diarioSporco: true,
      festaFino: 0, ritmoScena: 200, ultimoFotogramma: 0,
      extra: new Map(), schede: [], visibili: new Set(), sel: 0, selStato: null,
      nelMenu, ritorno: null, premioFine: 0, primaVoltaFine: true, prossima: "eureka", haSalvataggio: false, giriSalvataggio: 0
    };
    L = LINGUE[G.imp.lingua] ? G.imp.lingua : "it";
    sincronizzaTelecamera();
    preparaUfficio();
    chiudi("veloFine"); chiudi("veloRitorno"); chiudi("veloBiblioteca"); chiudi("veloScimmia");
    if (G.operaId === "mio") $("testoMio").value = G.testoMio;
    caricaOpera();
    progressiOffline();
    controllaTraguardi();
    R.caricamento = false;
    segnaQuantita();
    applicaLingua();
    applicaTema();
    Suono.aggiorna();
    // se si è appena azzerata la partita fuori dal menu, il gioco continua subito
    if (!R.nelMenu && R.fermo) apri("veloFine");
  }

  costruisciNegozio();
  costruisciTraguardi();
  collegaComandi();
  const salvato = carica();
  avvia(salvato || statoIniziale());
  R.haSalvataggio = !!salvato;
  $("menuIniziale").classList.remove("entra");   // il menu entra quando il sipario si apre
  mostraMenuIniziale();
  $("menuIniziale").classList.remove("entra");
  Online.collega();
  setTimeout(() => {
    $("sipario").classList.add("via");
    $("menuIniziale").classList.add("entra");
    setTimeout(() => $("sipario").remove(), 800);
  }, Math.max(350, 1100 - performance.now()));
  if (puoInstallare()) {
    $("bInstalla").hidden = false;
    if (!installaGiaVisto()) setTimeout(apriInstalla, 600);
  }

  let ultimo = performance.now(), ultimoDisegno = 0, ultimoLento = 0, ultimoSalvataggio = 0;
  function ciclo(ora) {
    const dt = Math.min(0.25, (ora - ultimo) / 1000);
    ultimo = ora;
    passo(dt);

    // le scimmiette in pixel: più sono veloci le scimmie, più battono in fretta
    R.ritmoScena = Math.max(70, Math.min(240, 240 / Math.pow(velocitaScimmia() / 4, 0.25)));
    if (ora - R.ultimoFotogramma > 110) {
      if (R.nelMenu) { const cv = $("cvTitolo"); if (cv.getContext) disegnaScrivania(cv.getContext("2d"), 78, ora, false); }
      if (R.sel) disegnaSchedaScimmia(ora);
      if (vistaAttiva("scimmie")) disegnaUfficio(ora);
      R.ultimoFotogramma = ora;
    }

    if (ora - ultimoDisegno > 90) { disegnaTutto(); ultimoDisegno = ora; }
    if (ora - ultimoLento > 1000) {
      controllaTraguardi(); disegnaBadge();
      if (vistaAttiva("traguardi")) disegnaTraguardi();
      if (R.nelMenu) scriviMenuIniziale();
      ultimoLento = ora;
    }
    if (ora - ultimoSalvataggio > 5000) {
      salva();
      // online: ogni 30 secondi circa, solo se qualcosa è cambiato
      if (++R.giriSalvataggio % 6 === 0) { Online.salvaOnline(); Online.pubblicaRiga(); }
      ultimoSalvataggio = ora;
    }
    requestAnimationFrame(ciclo);
  }
  requestAnimationFrame(ciclo);

})();
</script>
<script>
  // Versione web: se accanto a questo file c'è service-worker.js, il gioco funziona anche senza connessione.
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener("load", () => { navigator.serviceWorker.register("service-worker.js").catch(() => {}); });
  }
</script>
</body>

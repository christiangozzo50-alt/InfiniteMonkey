    --oro: #f2a93b;
    --carta: #efe8d4;
    --inchiostro: #1c1a16;
    --ok: #74d394;
    --testo-2: #c7d8cb;
    --sfondo-alto: #1c3d2c;
    --hud: rgba(15, 33, 25, 0.82);
    --menu-bg: rgba(11, 25, 18, 0.88);
    --menu-grad: #23503a;
    --ombra-sec: #13291c;
    --speciale: #46401f;
    --pronto: #2e3b1c;
    --riscosso: #1d3524;
    --velo: rgba(5, 12, 8, 0.72);
    --accento-tenue: rgba(255, 210, 63, 0.15);
    --pixel: "Pixelify Sans", "Bricolage Grotesque", system-ui, sans-serif;
    --ui: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
    --tasti: "Special Elite", "Courier New", Courier, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    color: var(--testo); font-family: var(--ui); font-size: 16px; line-height: 1.4; min-height: 100vh;
    background: radial-gradient(120% 60% at 50% 0%, var(--sfondo-alto) 0%, var(--notte) 60%) fixed, var(--notte);
    font-variant-numeric: tabular-nums;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, textarea:focus-visible { outline: 3px solid var(--banana); outline-offset: 2px; }
  .colonna { max-width: 560px; margin: 0 auto; }

  /* =============== HUD =============== */
  .hud {
    position: sticky; top: 0; z-index: 20;
    background: var(--hud); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px;
    border-bottom: 1px solid var(--bordo);
  }
  .hud .colonna { display: flex; align-items: center; gap: 8px; }
  .cassa { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; }
  .cassa .ico { font-size: 30px; line-height: 1; }
  .cassa .tot { font-family: var(--ui); font-size: 30px; font-weight: 800; line-height: 1; color: var(--banana); }
  .cassa .rit { font-size: 13px; color: var(--spento); margin-top: 3px; }
  .riga-tot { display: flex; align-items: center; gap: 8px; }
  .campo-nome {
    width: 100%; box-sizing: border-box; border-radius: 12px; border: 1px solid var(--linea); background: var(--notte);
    color: var(--testo); font: inherit; font-size: 17px; padding: 12px 14px; margin: 4px 0 6px;
  }
  .versione-gioco { text-align: center; color: var(--spento); font-size: 12px; margin: 14px 0 0; opacity: .8; }
  .foglio-basso textarea.codice-trasf { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; word-break: break-all; min-height: 130px; }
  .info-i {
    width: 24px; height: 24px; flex: none; border-radius: 50%; border: 1.5px solid var(--spento); background: none;
    color: var(--spento); font: italic 700 14px/1 Georgia, "Times New Roman", serif; display: grid; place-items: center; padding: 0;
  }
  .info-lista { list-style: none; padding: 0; margin: 4px 0 12px; display: grid; gap: 10px; }
  .info-lista li { background: var(--foglia-2); border-radius: 14px; padding: 11px 13px; line-height: 1.45; font-size: 15px; }
  .info-fine { color: var(--spento); font-size: 14.5px; margin: 0 0 6px; }
  .passi-inst { padding-left: 22px; margin: 6px 0 12px; display: grid; gap: 10px; font-size: 15.5px; line-height: 1.4; }
  .nota-inst { color: var(--spento); font-size: 13.5px; margin: 0 0 10px; }
  .gettone {
    display: flex; align-items: center; gap: 5px; padding: 6px 10px; border-radius: 999px;
    background: var(--foglia-1); border: 1px solid var(--bordo); font-weight: 600; font-size: 13.5px; white-space: nowrap;
  }
  .gettone.oro { color: var(--oro); }
  .tondo {
    width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--bordo); background: var(--foglia-1);
    display: flex; align-items: center; justify-content: center; font-size: 18px; padding: 0;
  }

  /* =============== SCHERMATE =============== */
  .schermata { display: none; padding: 16px 16px calc(112px + env(safe-area-inset-bottom, 0px)); }
  .schermata.attiva { display: block; }
  .titolo-sez { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 4px 0 12px; }
  .titolo-sez h2 { font-family: var(--pixel); font-size: 26px; font-weight: 700; margin: 0; }
  .titolo-sez span { color: var(--spento); font-size: 14px; }
  .riquadro { background: var(--foglia-1); border: 1px solid var(--bordo); border-radius: 20px; padding: 16px; margin-bottom: 14px; }
  .riquadro h3 { font-family: var(--pixel); font-size: 19px; font-weight: 700; margin: 0 0 10px; }

  /* =============== MENU FLUTTUANTE =============== */
  .menu {
    position: fixed; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 20;
    max-width: 540px; margin: 0 auto;
    background: var(--menu-bg); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--bordo); border-radius: 24px; padding: 6px;
    display: flex; gap: 4px; box-shadow: 0 12px 30px -12px #000;
  }
  .menu button {
    flex: 1; position: relative; background: none; border: 0; color: var(--spento);
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 7px 2px 6px; border-radius: 18px; font-size: 11.5px; font-weight: 600;
  }
  .menu button .ico { font-size: 22px; line-height: 1; transition: transform .15s; }
  .menu button[aria-current="page"] { color: var(--banana); background: var(--foglia-2); }
  .menu button[aria-current="page"] .ico { transform: translateY(-1px) scale(1.08); }
  .menu .pallino {
    position: absolute; top: 3px; right: calc(50% - 22px); min-width: 18px; height: 18px; padding: 0 5px;
    border-radius: 9px; background: var(--nastro); color: #fff; font-size: 11px; font-weight: 800;
    display: none; align-items: center; justify-content: center; line-height: 1;
  }
  .menu .pallino.vis { display: flex; }

  /* =============== UFFICIO DELLE SCIMMIE =============== */
  .ufficio { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
  .scrivania { background: var(--foglia-1); border: 1px solid var(--bordo); border-radius: 14px; overflow: hidden; }
  .scrivania.re { border-color: var(--banana); box-shadow: 0 0 0 1px var(--banana); }
  .scrivania canvas { display: block; width: 100%; height: auto; aspect-ratio: 40 / 30; image-rendering: pixelated; image-rendering: crisp-edges; }
  .scrivania .targa { display: flex; justify-content: space-between; align-items: center; gap: 4px; padding: 5px 7px 3px; font-size: 12px; font-weight: 700; }
  .scrivania .targa span { color: var(--banana); font-weight: 700; font-size: 11.5px; white-space: nowrap; }
  .scrivania .carta-s {
    margin: 0 6px 6px; background: var(--carta); color: var(--inchiostro); font-family: var(--tasti); font-size: 12px;
    padding: 3px 5px; border-radius: 4px; white-space: pre; overflow: hidden; direction: rtl; text-align: left; min-height: 21px;
  }
  .scrivania bdi { direction: ltr; unicode-bidi: isolate; }
  .scrivania mark { background: #f8dc7a; color: var(--inchiostro); }
  .fine-ufficio { color: var(--spento); font-size: 14px; text-align: center; margin: 16px 0 0; }
  .scrivania { cursor: pointer; transition: transform .1s; }
  .scrivania:active { transform: scale(.97); }

  /* scheda della singola scimmia */
  .scheda-testa { display: flex; gap: 14px; align-items: center; margin-bottom: 12px; }
  .scheda-testa canvas { width: 128px; height: auto; aspect-ratio: 40 / 30; image-rendering: pixelated; image-rendering: crisp-edges; border-radius: 14px; flex: none; }
  .scheda-testa h2 { margin: 0; }
  .scheda-testa p { margin: 4px 0 0; color: var(--spento); font-size: 14px; }
  .pagina {
    background: var(--carta); color: var(--inchiostro); font-family: var(--tasti); font-size: 18px; line-height: 1.5;
    padding: 12px 14px; border-radius: 8px; height: 30vh; min-height: 140px; overflow-y: auto;
    white-space: pre-wrap; word-break: break-all;
  }
  .pagina mark { background: #f8dc7a; color: var(--inchiostro); }
  .obiettivo { font-size: 14.5px; color: var(--spento); margin: 12px 0; }
  .obiettivo .t { font-family: var(--tasti); color: var(--testo); }
  .obiettivo .t b { color: var(--banana); font-weight: 400; background: var(--accento-tenue); }
  .mini-stat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .mini-stat div { background: var(--foglia-2); border-radius: 14px; padding: 10px; }
  .mini-stat small { display: block; color: var(--spento); font-size: 12px; }
  .mini-stat strong { font-size: 18px; font-weight: 800; }

  /* =============== OPERA =============== */
  .foglio {
    background: var(--carta); color: var(--inchiostro); border-radius: 6px;
    padding: 18px 18px 16px; position: relative;
    box-shadow: 0 10px 0 -5px #d4ccb4, 0 20px 0 -10px #b9b199, 0 26px 30px -16px #000;
    margin-bottom: 26px;
  }
  .foglio-testa { display: flex; align-items: flex-start; gap: 10px; }
  .foglio-testa .chi { flex: 1; min-width: 0; }
  .foglio-testa h2 { font-family: var(--tasti); font-weight: 400; font-size: 25px; margin: 0; line-height: 1.15; }
  .foglio-testa p { margin: 3px 0 0; font-size: 13.5px; color: #615a49; }
  .cambia {
    background: var(--inchiostro); color: var(--carta); border: 0; border-radius: 12px;
    padding: 8px 11px; font-size: 13.5px; font-weight: 600; white-space: nowrap;
  }
  .manoscritto {
    position: relative; font-family: var(--tasti); font-size: clamp(21px, 6vw, 28px); line-height: 1.55;
    max-height: 34vh; overflow-y: auto; margin-top: 14px; word-break: break-word;
  }
  .manoscritto .record { color: #776d57; text-decoration: underline dotted var(--nastro); text-underline-offset: 5px; }
  .manoscritto .resto { opacity: .2; }
  .cursore {
    display: inline-block; width: 2px; height: 1.05em; background: var(--nastro);
    vertical-align: -0.18em; margin: 0 1px; animation: lampeggia 1s steps(1) infinite;
  }
  @keyframes lampeggia { 50% { opacity: 0; } }
  .barra { height: 8px; background: #d9d1bb; border-radius: 4px; margin-top: 16px; position: relative; overflow: hidden; }
  .barra .rec { position: absolute; inset: 0 auto 0 0; background: #eaa79d; }
  .barra .ora { position: absolute; inset: 0 auto 0 0; background: var(--nastro); }
  .foglio-piede { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .targhetta {
    display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; border-radius: 999px;
    background: #e2d9c1; font-size: 13.5px; font-weight: 600; color: #3b352a;
  }
  .targhetta.festa { animation: festa 1.4s ease-out; }
  @keyframes festa { 0% { background: var(--banana); transform: scale(1.12); } 100% { background: #e2d9c1; transform: none; } }

  .tessere { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .tessera { background: var(--foglia-1); border: 1px solid var(--bordo); border-radius: 18px; padding: 12px; min-width: 0; }
  .tessera .ico { font-size: 20px; }
  .tessera strong { display: block; font-family: var(--ui); font-size: 21px; font-weight: 800; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tessera small { color: var(--spento); font-size: 12.5px; }

  /* =============== NEGOZIO =============== */
  .segmenti { display: flex; background: var(--foglia-1); border: 1px solid var(--bordo); border-radius: 16px; padding: 4px; gap: 4px; margin-bottom: 10px; }
  .segmenti button {
    flex: 1; border: 0; background: none; color: var(--spento); padding: 9px 4px; border-radius: 12px;
    font-weight: 600; font-size: 14px; position: relative;
  }
  .segmenti button[aria-pressed="true"] { background: var(--foglia-2); color: var(--testo); }
  .segmenti .punto { position: absolute; top: 6px; right: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--banana); display: none; }
  .segmenti .punto.vis { display: block; }
  .quantita { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; }
  .quantita span { color: var(--spento); font-size: 13.5px; margin-right: auto; }
  .quantita button {
    border: 1px solid var(--linea); background: none; border-radius: 10px; padding: 5px 10px;
    font-weight: 600; font-size: 13.5px; color: var(--spento);
  }
  .quantita button[aria-pressed="true"] { background: var(--banana); color: var(--banana-inchiostro); border-color: var(--banana); }
  .riassunto { color: var(--spento); font-size: 14px; margin: 0 0 12px; }
  .lista-pot[hidden] { display: none; }

  .pot { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  .pot.premuto { transform: scale(0.98); }
  .sez-pot { display: flex; flex-direction: column; gap: 2px; margin: 16px 2px 9px; font-size: 16.5px; }
  .sez-pot:first-child { margin-top: 2px; }
  .sez-pot small { color: var(--spento); font-weight: 400; font-size: 13px; }
  .suggerimento-tieni { color: var(--spento); font-size: 13px; margin: -2px 0 10px; }
  .pot {
    position: relative; overflow: hidden; display: grid; grid-template-columns: 46px 1fr auto; gap: 12px; align-items: center;
    width: 100%; text-align: left; background: var(--foglia-1); border: 1px solid var(--bordo); border-radius: 18px;
    padding: 12px 12px 14px; margin-bottom: 9px;
  }
  .pot[hidden] { display: none; }
  .pot .ico {
    width: 46px; height: 46px; border-radius: 14px; background: var(--foglia-2);
    display: flex; align-items: center; justify-content: center; font-size: 25px;
  }
  .pot .corpo { min-width: 0; }
  .pot .nome { font-weight: 800; font-size: 15.5px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .pot .possesso { background: var(--foglia-2); color: var(--testo); border-radius: 7px; padding: 1px 7px; font-size: 12.5px; font-weight: 600; }
  .pot .effetto { display: block; font-size: 13.5px; color: var(--testo-2); margin-top: 2px; }
  .pot .soglia { display: block; font-size: 12.5px; color: var(--oro); margin-top: 3px; }
  .pot .soglia:empty { display: none; }
  .pot .prezzo {
    min-width: 92px; padding: 8px 10px; border-radius: 13px; text-align: center;
    background: var(--banana); color: var(--banana-inchiostro); box-shadow: 0 3px 0 var(--banana-ombra);
  }
  .pot .prezzo .q { display: block; font-size: 11.5px; font-weight: 600; opacity: .8; }
  .pot .prezzo .c { display: block; font-size: 15px; font-weight: 800; white-space: nowrap; }
  .pot:active .prezzo { transform: translateY(2px); box-shadow: 0 1px 0 var(--banana-ombra); }
  .pot.caro .prezzo { background: var(--foglia-2); color: var(--spento); box-shadow: 0 3px 0 var(--ombra-sec); }
  .pot.caro .prezzo .q { opacity: 1; }
  .pot.completo .prezzo { background: none; box-shadow: none; color: var(--ok); border: 1px dashed var(--linea); }
  .pot .riempi { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--banana); opacity: .75; width: 0; }
  .pot.speciale .ico { background: var(--speciale); }
  .pot.comprato { animation: comprato .35s ease-out; }
  @keyframes comprato { 0% { transform: scale(.97); } 60% { transform: scale(1.015); } 100% { transform: none; } }
  .presi { color: var(--spento); font-size: 13px; margin: 4px 2px 0; }

  /* =============== SCIMMIE =============== */
  .campione { background: var(--foglia-1); border: 2px solid var(--banana); border-radius: 22px; padding: 14px; margin-bottom: 20px; }
  .campione .riga1 { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .campione .riga1 b { font-family: var(--ui); font-weight: 800; font-size: 18px; }
  .campione .riga1 span { color: var(--banana); font-weight: 600; font-size: 13.5px; white-space: nowrap; }
  .campione .carta-rec {
    background: var(--carta); color: var(--inchiostro); font-family: var(--tasti); font-size: 18px;
    padding: 10px 12px; border-radius: 8px; margin: 10px 0 8px; min-height: 44px; word-break: break-word;
  }
  .campione .carta-rec mark { background: #f8dc7a; color: var(--inchiostro); }
  .campione .dati { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; color: var(--spento); }
  .campione .dati b { color: var(--testo); }
  .altre { color: var(--spento); font-size: 14px; margin-top: 12px; }

  /* =============== TRAGUARDI =============== */
  .griglia-trag { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; }
  .trag { background: var(--foglia-1); border: 1px solid var(--bordo); border-radius: 18px; padding: 12px; display: flex; flex-direction: column; }
  .trag.bloccato .ico, .trag.bloccato b { opacity: .5; }
  .trag.pronto { background: var(--pronto); border-color: var(--banana); }
  .trag.riscosso { background: var(--riscosso); }
  .trag .ico { font-size: 24px; }
  .trag b { display: block; font-size: 14.5px; margin-top: 4px; }
  .trag small { display: block; color: var(--spento); font-size: 12.5px; margin-top: 2px; }
  .trag .premio { color: var(--banana); font-size: 12.5px; font-weight: 600; margin-top: 6px; }
  .trag.bloccato .premio { color: var(--oro); font-weight: 400; opacity: .85; }
  .trag.pronto { order: -1; }
  .trag.riscosso { order: 1; }
  .trag .avanz { height: 4px; background: var(--foglia-2); border-radius: 2px; margin-top: 8px; overflow: hidden; }
  .trag .avanz div { height: 100%; background: var(--oro); width: 0; }
  .trag:not(.bloccato) .avanz { display: none; }
  .trag .riscuoti {
    margin-top: 9px; border: 0; border-radius: 12px; padding: 8px 6px; font-weight: 800; font-size: 13.5px;
    background: var(--banana); color: var(--banana-inchiostro); box-shadow: 0 3px 0 var(--banana-ombra);
  }
  .trag .riscuoti:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--banana-ombra); }
  .trag .fatto { margin-top: 8px; color: var(--ok); font-size: 13px; font-weight: 600; }
  .trag:not(.pronto) .riscuoti, .trag:not(.riscosso) .fatto { display: none; }
  .riscuoti-tutto {
    border: 0; border-radius: 12px; padding: 7px 12px; font-weight: 800; font-size: 13.5px;
    background: var(--banana); color: var(--banana-inchiostro); box-shadow: 0 3px 0 var(--banana-ombra);
  }
  .riscuoti-tutto[hidden] { display: none; }

  /* =============== DIARIO =============== */
  .info { display: grid; gap: 8px; font-size: 15px; }
  .info b { color: var(--banana); font-weight: 600; }
  .info .nota { color: var(--spento); font-size: 13.5px; }
  .info .es-record { text-decoration: underline dotted var(--nastro); text-underline-offset: 3px; }
  .stat { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 10px; }
  .stat small { display: block; color: var(--spento); font-size: 12.5px; }
  .stat strong { font-family: var(--ui); font-size: 19px; font-weight: 800; }
  .cronaca { list-style: none; padding: 0; margin: 0; font-size: 14.5px; }
  .cronaca li { padding: 9px 0; border-bottom: 1px solid var(--linea); }
  .cronaca li:last-child { border-bottom: 0; }
  .cronaca q { font-family: var(--tasti); color: var(--banana); quotes: "«" "»"; }
  .cronaca small { color: var(--spento); display: block; margin-top: 1px; }
  .cronaca .grande { color: var(--banana); font-weight: 600; }

  /* =============== FOGLI E FINESTRE =============== */
  .velo { position: fixed; inset: 0; z-index: 40; background: var(--velo); display: none; }
  .velo.aperto { display: flex; }
  .velo.centro { align-items: center; justify-content: center; padding: 20px; }
  .velo.basso { align-items: flex-end; justify-content: center; }
  .finestra { background: var(--foglia-1); border: 1px solid var(--bordo); border-radius: 26px; padding: 22px 20px 18px; width: 100%; max-width: 420px; text-align: center; animation: sale .22s ease-out; }
  @keyframes sale { from { transform: translateY(14px) scale(.98); opacity: 0; } }
  .finestra .grande-ico { font-size: 52px; line-height: 1; }
  .finestra h2 { font-family: var(--pixel); font-size: 27px; font-weight: 700; margin: 10px 0 8px; }
  .finestra p { color: var(--testo-2); margin: 0 0 8px; }
  .finestra .righe { text-align: left; background: var(--foglia-2); border-radius: 16px; padding: 10px 14px; margin: 12px 0; display: grid; gap: 6px; font-size: 15px; }
  .finestra .righe b { color: var(--banana); }
  .azioni { display: grid; gap: 8px; margin-top: 14px; }
  .pulsante {
    border: 0; border-radius: 16px; padding: 13px 16px; font-weight: 800; font-size: 16px;
    background: var(--banana); color: var(--banana-inchiostro); box-shadow: 0 3px 0 var(--banana-ombra);
  }
  .pulsante:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--banana-ombra); }
  .pulsante.secondario { background: var(--foglia-2); color: var(--testo); box-shadow: 0 3px 0 var(--ombra-sec); }
  .pulsante.pericolo { background: none; border: 1px solid var(--nastro); color: var(--nastro); box-shadow: none; }

  .foglio-basso {

    { id: "amleto", titolo: "That is the question", autore: "shakespeare", opera: "amleto",

     "en": "Always dear to me was this lonely hill, and this hedge, which from so great a part of the farthest horizon shuts out the view. But sitting and gazing, I imagine in my thought endless spaces beyond it, and superhuman silences, and deepest quiet; where the heart almost takes fright. And as I hear the wind rustle among these plants, I go comparing that infinite silence to this voice: and I recall the eternal, and the dead seasons, and the present living one, and its sound. So in this immensity my thought drowns: and shipwreck is sweet to me in this sea.",

     "fr": "Toujours chère me fut cette colline solitaire, et cette haie, qui d'une si grande part de l'ultime horizon dérobe le regard. Mais assis et contemplant, des espaces sans limites au-delà d'elle, et des silences surhumains, et une quiétude très profonde, je me les figure en pensée ; où pour un peu le cœur s'effraie. Et comme j'entends le vent bruire parmi ces plantes, ce silence infini à cette voix je vais comparant : et il me souvient de l'éternel, et des saisons mortes, et de la présente et vivante, et de son bruit. Ainsi dans cette immensité se noie ma pensée : et le naufrage m'est doux dans cette mer.",

    const ACCORDI = [
      { basso: 110.00, note: [220.00, 261.63, 329.63, 392.00] },
      { basso: 146.83, note: [293.66, 349.23, 440.00, 523.25] },
      { basso: 98.00,  note: [196.00, 246.94, 293.66, 349.23] },
      { basso: 130.81, note: [261.63, 329.63, 392.00, 493.88] }
    ];
    const SCALA = [440.00, 523.25, 587.33, 659.25, 783.99, 880.00];
    const OTTAVO = 60 / 84 / 2;

    // mezzo secondo di silenzio in formato WAV, creato al volo
    function wavMuto() {
      const n = 4000, buf = new ArrayBuffer(44 + n), v = new DataView(buf);
      const scrivi = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
      scrivi(0, "RIFF"); v.setUint32(4, 36 + n, true); scrivi(8, "WAVE"); scrivi(12, "fmt ");
      v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
      v.setUint32(24, 8000, true); v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true);
      scrivi(36, "data"); v.setUint32(40, n, true);
      for (let i = 0; i < n; i++) v.setUint8(44 + i, 128);
      return URL.createObjectURL(new Blob([buf], { type: "audio/wav" }));
    }

    function sblocca() {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      // iPhone: chiede di trattare il gioco come riproduzione multimediale, così il tasto silenzioso non lo zittisce
      try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
      try {
        if (!muto && window.Audio) {
          muto = new window.Audio(wavMuto());
          muto.loop = true;
          muto.setAttribute("playsinline", "");
        }
        if (muto && muto.paused) { const p = muto.play(); if (p && p.catch) p.catch(() => {}); }
      } catch (e) {}
      if (!ctx) {
        ctx = new AC();
        const comp = ctx.createDynamicsCompressor();
        comp.connect(ctx.destination);
        master = ctx.createGain(); master.gain.value = 1; master.connect(comp);
        gMusica = ctx.createGain(); gMusica.gain.value = 0; gMusica.connect(master);
        gEffetti = ctx.createGain(); gEffetti.gain.value = 0; gEffetti.connect(master);
        const len = Math.floor(ctx.sampleRate * 0.06);
        rumore = ctx.createBuffer(1, len, ctx.sampleRate);
        const d = rumore.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      }
      // un suono vuoto suonato dentro il tocco: serve a Safari per sbloccare l'audio
      if (!primoSblocco) {
        const b = ctx.createBufferSource(); b.buffer = ctx.createBuffer(1, 1, 22050);
        b.connect(ctx.destination); b.start(0);
        primoSblocco = true;
      }
      if (ctx.state !== "running") {
        const p = ctx.resume();
        if (p && p.then) p.then(aggiorna).catch(() => {});
      }
      aggiorna();
    }
    const pronto = () => ctx && ctx.state === "running";

    // applica i volumi scelti nelle impostazioni (0-100)
    function aggiorna() {
      if (!ctx) return;
      gMusica.gain.setTargetAtTime(1.4 * G.imp.musica / 100, ctx.currentTime, 0.3);
      gEffetti.gain.setTargetAtTime(2.2 * G.imp.effetti / 100, ctx.currentTime, 0.05);
      if (G.imp.musica > 0 && !timerMusica) {
        prossima = ctx.currentTime + 0.15;
        timerMusica = setInterval(pianifica, 60);
      } else if (G.imp.musica === 0 && timerMusica) {
        clearInterval(timerMusica); timerMusica = null;
      }
    }

    function nota(freq, t0, durata, o = {}) {
      const { tipo = "sine", vol = 0.1, attacco = 0.005, uscita = gEffetti, filtro = 0 } = o;
      const osc = ctx.createOscillator(), g = ctx.createGain();
      osc.type = tipo; osc.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol, t0 + attacco);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + durata);
      osc.connect(g);
      if (filtro) {
        const f = ctx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = filtro;
        g.connect(f); f.connect(uscita);
      } else g.connect(uscita);
      osc.start(t0); osc.stop(t0 + durata + 0.05);
    }
    function fruscio(t0, vol, freq, durata, uscita) {
      const s = ctx.createBufferSource(); s.buffer = rumore;
      const f = ctx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = freq; f.Q.value = 0.9;
      const g = ctx.createGain();
      g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + durata);
      s.connect(f); f.connect(g); g.connect(uscita);
      s.start(t0); s.stop(t0 + durata + 0.02);
    }

    // ---- musica: accordi morbidi, basso e una melodia pentatonica sempre diversa ----
    function pianifica() {
      if (!pronto()) return;
      while (prossima < ctx.currentTime + 0.3) {
        suonaPasso(passoMus, prossima);
        prossima += OTTAVO;
        passoMus = (passoMus + 1) % 32;
      }
    }
    function suonaPasso(p, t0) {
      const acc = ACCORDI[Math.floor(p / 8)], b = p % 8;
      if (b === 0) for (const f of acc.note) nota(f, t0, OTTAVO * 8.5, { tipo: "triangle", vol: 0.02, attacco: 0.5, uscita: gMusica, filtro: 900 });
      if (b === 0 || b === 4) nota(acc.basso, t0, OTTAVO * 3, { vol: 0.1, attacco: 0.01, uscita: gMusica });
      if (b % 2 === 1) fruscio(t0, 0.012, 7000, 0.04, gMusica);
      if (Math.random() < (b % 2 ? 0.18 : 0.42)) {
        const f = SCALA[Math.floor(Math.random() * SCALA.length)];
        nota(f, t0, 0.6, { vol: 0.04, uscita: gMusica });
        nota(f * 2, t0, 0.25, { vol: 0.008, uscita: gMusica });
      }
    }

    const effetti = () => pronto() && G.imp.effetti > 0;
    return {
      sblocca, aggiorna, pronto,
      sospendi() {
        if (ctx && ctx.state === "running") ctx.suspend();
        if (muto && !muto.paused) muto.pause();
      },
      stato() { return !ctx ? "spento" : ctx.state === "running" ? "attivo" : "bloccato"; },
      clic() { if (effetti()) nota(700, ctx.currentTime, 0.06, { vol: 0.06 }); },
      compra() {
        if (!effetti()) return;
        const t0 = ctx.currentTime;
        nota(1046.5, t0, 0.12, { tipo: "triangle", vol: 0.09 });
        nota(1568, t0 + 0.07, 0.22, { tipo: "triangle", vol: 0.09 });
      },
      nego() { if (effetti()) nota(180, ctx.currentTime, 0.12, { tipo: "triangle", vol: 0.06 }); },
      record() {
        if (!effetti()) return;
        const t0 = ctx.currentTime;
        [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => nota(f, t0 + i * 0.07, 0.3, { tipo: "triangle", vol: 0.08 }));
      },
      traguardo() {
        if (!effetti()) return;
        const t0 = ctx.currentTime;
        [1046.5, 1568, 2093].forEach((f, i) => nota(f, t0 + i * 0.03, 1.1, { vol: 0.05 }));
      },
      moneta() {
        if (!effetti()) return;
        const t0 = ctx.currentTime;
        nota(987.77, t0, 0.08, { tipo: "square", vol: 0.04 });
        nota(1318.5, t0 + 0.08, 0.35, { tipo: "square", vol: 0.04 });
      },
      fine() {
        if (!effetti()) return;
        const t0 = ctx.currentTime;
        [523.25, 659.25, 783.99, 1046.5, 1318.5, 1568].forEach((f, i) => nota(f, t0 + i * 0.09, 0.5, { tipo: "triangle", vol: 0.08 }));
      },
      prova() {
        if (!pronto()) return;
        const t0 = ctx.currentTime;
        const usc = G.imp.effetti > 0 ? gEffetti : master;
        [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => nota(f, t0 + i * 0.1, 0.4, { tipo: "triangle", vol: 0.12, uscita: usc }));
      }
    };
  })();

  // =====================================================================
  //  PIXEL ART: la scimmietta alla scrivania
  // =====================================================================
  const PAL = {
    b: "#8b5a2b", t: "#e8c49a", k: "#1c1a16", m: "#b5545c", n: "#a87c55",
    G: "#2b3035", g: "#59626b", w: "#cfd5d9", y: "#ffd23f", Y: "#7a5c12"
  };
  const TESTA = [
    ".....bbbbbb.....",
    "...bbbbbbbbbb...",
    "..bbbbbbbbbbbb..",
    ".bbttttbbttttbb.",
    "tbbttttttttttbbt",
    "tbbttkttttkttbbt",
    "tbbttttttttttbbt",
    ".bbbttttttttbbb.",
    "..bbttttttttbb..",
    "..bbttnttnttbb..",
    "...bbttttttbb...",
    "....bbtmmtbb....",
    ".....bbbbbb....."
  ];
  const MACCHINA = [
    "..GGGGGGGGGGGGGGGGGG..",
    ".GggggggggggggggggggG.",
    "GGGGGGGGGGGGGGGGGGGGGG",
    "GwGwGwGwGwGwGwGwGwGwGG",
    "GGwGwGwGwGwGwGwGwGwGGG",
    "GGGGGGGGGGGGGGGGGGGGGG",
    ".GGGGGGGGGGGGGGGGGGGG."
  ];
  const BANANA = [
    "......Y",
    ".....yy",
    "y...yy.",
    ".yyyy.."
  ];

  function sprite(ctx, righe, x, y, sost, colori) {
    for (let r = 0; r < righe.length; r++) {
      const riga = righe[r];
      for (let c = 0; c < riga.length; c++) {
        let ch = riga[c];
        if (ch === ".") continue;
        if (sost && sost[r] && sost[r][c]) ch = sost[r][c];
        ctx.fillStyle = (colori && colori[ch]) || PAL[ch];
        ctx.fillRect(x + c, y + r, 1, 1);
      }
    }
  }
  const rett = (ctx, colore, x, y, w, h) => { ctx.fillStyle = colore; ctx.fillRect(x, y, w, h); };

  // Ogni scimmia ha un aspetto suo, sempre uguale: pelliccia, accessorio, box e oggetto sulla scrivania
  const PELLICCE = [
    { b: "#8b5a2b" }, { b: "#6e4422" }, { b: "#a8743a" },
    { b: "#7a7a7a", t: "#ddcfbd" }, { b: "#c58a3f" }, { b: "#4a3a30", t: "#d8b48c" }
  ];
  const MURI = [["#1c3a2a", "#16301f"], ["#1f3446", "#182a39"], ["#33293f", "#292133"], ["#3a3324", "#2f291c"], ["#24343a", "#1c2a2f"]];
  function hashId(id) {
    let h = (id * 2654435761) >>> 0;
    h ^= h >>> 15; h = Math.imul(h, 2246822519) >>> 0; h ^= h >>> 13;
    return h >>> 0;
  }

  function disegnaScrivania(ctx, id, ora, ferma) {
    const h = hashId(id);
    const pel = PELLICCE[h % PELLICCE.length];
    const [muro, ombra] = MURI[(h >>> 4) % MURI.length];
    const accessorio = (h >>> 8) % 7;
    const oggetto = (h >>> 12) % 4;
    const deco = (h >>> 16) % 4;
    const festa = id === G.recordChi && Date.now() - G.recordTs < 3500;
    const passo = ferma ? 0 : Math.floor((ora + (h % 997)) / R.ritmoScena);
    const scrive = passo % 2;

    rett(ctx, muro, 0, 0, 40, 30);
    rett(ctx, ombra, 0, 0, 2, 27); rett(ctx, ombra, 38, 0, 2, 27);
    const dx = (h >>> 20) % 2 ? 3 : 30;
    if (deco === 0) {
      rett(ctx, "#2f5a40", dx, 3, 7, 6); rett(ctx, "#0d1b2a", dx + 1, 4, 5, 4);
      rett(ctx, "#2f5a40", dx + 3, 4, 1, 4);
      if (Math.floor(ora / 900 + id) % 3) rett(ctx, "#ffffff", dx + 1, 5, 1, 1);
      rett(ctx, PAL.y, dx + 4, 4, 1, 1);
    } else if (deco === 1) {
      rett(ctx, "#6b4423", dx, 3, 7, 6); rett(ctx, ["#c0392b", "#2c4f8c", "#4f8a5b"][h % 3], dx + 1, 4, 5, 4);
      rett(ctx, PAL.y, dx + 2, 5, 2, 2);
    } else if (deco === 2) {
      rett(ctx, "#e9e4d4", dx + 1, 3, 5, 5); rett(ctx, "#e9e4d4", dx, 4, 7, 3);
      rett(ctx, "#1c1a16", dx + 3, 4, 1, 2); rett(ctx, "#1c1a16", dx + 3, 5, 2, 1);
    }

    rett(ctx, "#8a5a2e", 0, 27, 40, 1);
    rett(ctx, "#5e3b1e", 0, 28, 40, 2);

    if (oggetto === 0) sprite(ctx, BANANA, 32, 23);
    else if (oggetto === 1) { rett(ctx, "#e9e4d4", 33, 23, 3, 4); rett(ctx, "#e9e4d4", 36, 24, 1, 2); rett(ctx, "#6b4423", 33, 23, 3, 1); }
    else if (oggetto === 2) { rett(ctx, "#a0522d", 32, 24, 4, 3); rett(ctx, "#4fa35e", 33, 21, 2, 3); rett(ctx, "#3f8a4f", 32, 20, 1, 2); rett(ctx, "#3f8a4f", 35, 20, 1, 2); }
    else { rett(ctx, "#cfd5d9", 31, 23, 7, 4); rett(ctx, "#efe8d4", 32, 22, 5, 1); }

    rett(ctx, pel.b, 13, 14, 14, 7);
    if (festa) { rett(ctx, pel.b, 9, 5, 3, 10); rett(ctx, pel.b, 28, 5, 3, 10); }
    else { rett(ctx, pel.b, 11, 15, 2, 6); rett(ctx, pel.b, 27, 15, 2, 6); }

    sprite(ctx, TESTA, 12, 1, festa ? { 11: { 6: "m", 9: "m" } } : null, pel);
    if (accessorio === 2) {
      rett(ctx, "#7ec4d8", 16, 5, 3, 3); rett(ctx, "#7ec4d8", 21, 5, 3, 3);
      rett(ctx, "#1c1a16", 17, 6, 1, 1); rett(ctx, "#1c1a16", 22, 6, 1, 1);
      rett(ctx, "#1c1a16", 16, 5, 3, 1); rett(ctx, "#1c1a16", 21, 5, 3, 1); rett(ctx, "#1c1a16", 19, 6, 2, 1);
    } else if (accessorio === 3) {
      rett(ctx, "#c0392b", 16, 0, 8, 2); rett(ctx, "#c0392b", 22, 2, 5, 1);
    } else if (accessorio === 4) {
      rett(ctx, "#e86a9a", 13, 2, 2, 3); rett(ctx, "#c2477a", 15, 3, 1, 1);
    } else if (accessorio === 5) {
      rett(ctx, "#333a40", 14, 0, 12, 1); rett(ctx, "#333a40", 12, 4, 2, 4); rett(ctx, "#333a40", 26, 4, 2, 4);
    }

    rett(ctx, "#efe8d4", 14, 14, 12, 6);
    const giro = passo % 10, riga = Math.floor(passo / 10);
    const pieno = (x, l) => ((x * 7 + l * 13 + id) % 5) !== 0;
    for (let x = 0; x < 10; x++) {
      if (pieno(x, riga - 2)) rett(ctx, "#a59c86", 15 + x, 14, 1, 1);
      if (pieno(x, riga - 1)) rett(ctx, "#a59c86", 15 + x, 16, 1, 1);
      if (x < giro && pieno(x, riga)) rett(ctx, "#5f5747", 15 + x, 18, 1, 1);
    }

    sprite(ctx, MACCHINA, 9, 20);
    const mano = pel.t || PAL.t;
    if (festa) {
      rett(ctx, mano, 9, 3, 3, 2); rett(ctx, mano, 28, 3, 3, 2);
      [[6, 1], [33, 2], [20, 0], [5, 8], [35, 9]].forEach(([x, y], i) => {
        if (Math.floor(ora / 150 + i) % 2) rett(ctx, i % 2 ? "#ffffff" : PAL.y, x, y, 1, 1);
      });
    } else {
      rett(ctx, mano, 12, scrive ? 20 : 22, 3, 2);
      rett(ctx, mano, 25, scrive ? 22 : 20, 3, 2);
    }
  }

  // =====================================================================
  //  POTENZIAMENTI (solo quantità di scimmie e velocità di battitura)
  // =====================================================================
  const STRUTTURE = [
    ["s0", "🐒", 1, 10], ["s1", "👨‍👩‍👧", 6, 4000], ["s2", "🦍", 36, 1.6e6], ["s3", "🏕️", 200, 6.4e8], ["s4", "🎪", 1200, 2.6e11],
    ["s5", "🌴", 7500, 1e14], ["s6", "🏝️", 45000, 4e16], ["s7", "🪐", 280000, 1.6e19], ["s8", "🌌", 1.7e6, 6.4e21]
  ];
  const UNICI_SCIMMIE = [
    ["m0", "👯", 2, 5000], ["m1", "📣", 3, 7e5], ["m2", "🧬", 5, 1e9],
    ["m3", "🌀", 10, 3e13], ["m4", "🪞", 100, 3e22], ["m5", "♾️", 1000, 1e36]
  ];
  // ---------- VELOCITÀ ----------
  // Miglioramenti: livelli senza limite, ogni livello moltiplica la velocità di tutte le scimmie.
  // [id, icona, moltiplicatore per livello, costo del primo livello, quanto cresce il costo a ogni livello]
  const MIGLIORAMENTI = [
    ["stretch", "🤸", 1.1, 50, 6],
    ["lezioni", "📝", 1.15, 300, 8],
    ["macchina", "🔧", 1.25, 2000, 10],
    ["caffe", "☕", 1.5, 5e4, 40]
  ];
  // Oggetti per scrivere: si comprano a pezzi (come le scimmie), ognuno aggiunge tasti al secondo a ogni scimmia.
  // [id, icona, tasti/s in più per scimmia, costo del primo pezzo]
  const OGGETTI = [
    ["o0", "🧤", 1, 30], ["o1", "💡", 6, 1.2e5], ["o2", "🪑", 36, 4.8e8], ["o3", "🔌", 216, 1.9e12],
    ["o4", "📠", 1300, 7.7e15], ["o5", "⌨️", 7800, 3.1e19], ["o6", "💻", 4.7e4, 1.2e23], ["o7", "🖥️", 2.8e5, 4.9e26],
    ["o8", "🚀", 1.7e6, 2e30], ["o9", "🌠", 1e7, 7.9e33]
  ];
  // vecchi potenziamenti unici di velocità (ora tolti) con il loro moltiplicatore:
  // nei salvataggi vecchi vengono convertiti in oggetti che danno la stessa velocità
  const VECCHI_UNICI_VEL = { v0: 2, v0b: 1.5, v1: 2, v1b: 1.5, v2: 3, v2b: 1.5, v3: 2, v4: 2, v4b: 1.5, v5: 5,
    v5b: 2, v6: 10, v6b: 3, v7: 100, v7b: 10, v8: 1000, v9: 1000 };

  const POT = [];
  STRUTTURE.forEach(([id, icona, dim, base], i) => POT.push({
    id, icona, gruppo: "scimmie", tipo: "struttura", dim, base, rapporto: 1.15,
    vis: () => i === 0 || G.liv[STRUTTURE[i - 1][0]] >= 3,
    effetto: () => { const x = dim * moltStruttura(id); return t("porta", { n: fmt(x), conta: x }); },
    soglia: () => {
      const prossima = SOGLIE.find(s => s > G.liv[id]);
      return prossima ? t("soglia", { n: prossima }) : t("soglia_tutte");
    }
  }));
  UNICI_SCIMMIE.forEach(([id, icona, molt, prezzo], i) => POT.push({
    id, icona, gruppo: "scimmie", tipo: "unico", molt, prezzo, max: 1,
    vis: () => i === 0 ? G.liv.s1 >= 1 : G.liv[UNICI_SCIMMIE[i - 1][0]] >= 1,
    effetto: () => t("eff_scimmie", { testo: descUnico(id), m: molt < 1000 ? decimale(molt) : fmt(molt) })
  }));
  POT.push({
    id: "asilo", icona: "🍼", gruppo: "scimmie", tipo: "livelli", base: 3000, rapporto: 3.5,
    vis: () => G.liv.s2 >= 1,
    effetto: () => t("eff_asilo", { a: G.liv.asilo, b: G.liv.asilo + 1 })
  });
  const VIS_MIGL = { stretch: () => true, lezioni: () => G.liv.stretch >= 1, macchina: () => G.liv.o1 >= 1, caffe: () => G.liv.o2 >= 1 };
  MIGLIORAMENTI.forEach(([id, icona, molt, base, rapporto]) => POT.push({
    id, icona, gruppo: "velocita", sezione: "sez-migl", tipo: "livelli", molt, base, rapporto,
    vis: VIS_MIGL[id],
    effetto: () => t("eff_liv_vel", { x: decimale(molt) })
  }));
  OGGETTI.forEach(([id, icona, agg, base], i) => POT.push({
    id, icona, gruppo: "velocita", sezione: "sez-ogg", tipo: "oggetto", agg, base, rapporto: 1.15,
    // si vede dopo 3 pezzi dell'oggetto precedente, o se possiedi già un oggetto più avanzato
    vis: () => i === 0 || G.liv[OGGETTI[i - 1][0]] >= 3 || OGGETTI.slice(i).some(([id2]) => G.liv[id2] > 0),
    effetto: () => t("eff_ogg", { testo: descUnico(id), n: fmt(agg) })
  }));
  POT.push({
    id: "notte", icona: "🌙", gruppo: "altro", tipo: "livelli", base: 500, rapporto: 4, max: 5,
    effetto: () => t("eff_notte", { a: Math.round(efficienzaNotte() * 100), b: Math.round(efficienzaNotte(Math.min(5, G.liv.notte + 1)) * 100) })
  });
  POT.push({
    id: "assenza", icona: "🔦", gruppo: "altro", tipo: "livelli", base: 2000, rapporto: 5, max: 6,
    effetto: () => t("eff_assenza", { a: oreOffline() + t("u_h"), b: oreOffline(Math.min(6, G.liv.assenza + 1)) + t("u_h") })
  });

  // =====================================================================
  //  TRAGUARDI: ognuno dà un premio in banane da riscuotere
  // =====================================================================
  // premio di ogni traguardo: percentuale del raccolto, crescente con la difficoltà
  const PCT_PREMIO = [3, 3, 5, 5, 8, 8, 10, 10, 12, 12, 15];
  const recordMassimo = () => Math.max(G.record, ...Object.values(G.archivio).map(a => a.record || 0),
    ...Object.values(G.lunghe || {}), G.fraseMio || 0);
  const TRAGUARDI = [];
  function gruppoTraguardi(prefisso, ico, soglie, desc, val) {
    soglie.forEach((n, i) => TRAGUARDI.push({ id: prefisso + n, ico, desc: () => desc(n), val, obiettivo: n, pct: PCT_PREMIO[i], min: 100 * Math.pow(3, i) }));
  }
  gruppoTraguardi("sc", "🐒", [25, 500, 1e4, 1e6, 1e9, 1e12, 1e18], n => t("desc_sc", { n: fmt(n) }), () => numScimmie());
  gruppoTraguardi("ts", "⌨️", [1e3, 1e5, 1e8, 1e11, 1e15, 1e20], n => t("desc_ts", { n: fmt(n) }), () => tastiAlSecondo());
  gruppoTraguardi("rc", "⭐", [3, 4, 5, 6, 7, 8, 10, 14, 18, 25, 35], n => t("desc_rc", { car: caratteri(n) }), () => recordMassimo());
  gruppoTraguardi("op", "📜", [1, 3, 5, 8], n => t("desc_op", { n }), () => G.opereFatte.length);
  gruppoTraguardi("tt", "🗂️", [1e9, 1e15, 1e24], n => t("desc_tt", { n: fmt(n) }), () => G.tasti);
  gruppoTraguardi("tm", "⏳", [7200, 36000], n => t("desc_tm", { t: fmtTempo(n) }), () => G.tempo);
  TRAGUARDI.push({ id: "asilo", ico: "🍼", desc: () => t("desc_asilo"), val: () => G.liv.asilo, obiettivo: 15, pct: 10 });
  TRAGUARDI.push({ id: "tech", ico: "🚀", desc: () => t("desc_tech"),
    val: () => OGGETTI.filter(([id]) => G.liv[id] >= 1).length, obiettivo: OGGETTI.length, pct: 15 });
  TRAGUARDI.push({ id: "multi", ico: "♾️", desc: () => t("desc_multi"),
    val: () => UNICI_SCIMMIE.filter(([id]) => G.liv[id]).length, obiettivo: UNICI_SCIMMIE.length, pct: 15 });
  TRAGUARDI.push({ id: "soglia200", ico: "🎯", desc: () => t("desc_soglia"),
    val: () => Math.max(...STRUTTURE.map(([id]) => G.liv[id])), obiettivo: 200, pct: 10 });
  TRAGUARDI.forEach((tr, i) => { tr.nome = () => NOMI_TRAG[L][i]; });

  // =====================================================================
  //  STATO
  // =====================================================================
  let G = null, R = null;

  function statoIniziale() {
    const liv = {};
    for (const p of POT) liv[p.id] = 0;
    return {
      operaId: "eureka", testoMio: "", record: 0, recordChi: 0, recordTs: 0, opereFatte: [],
      archivio: {}, traguardi: {}, qta: "1", nick: "", tutorialFatto: false, ufficioVuoto: true, paroleInOrdine: true, frasiModo: { facile: {}, normale: {}, realistica: {} }, paroleModo: {}, raccolto: 0, lettere: 0, fraseMio: 0, fraseMioModo: "normale", lunghe: {}, lungheModo: {}, linguaOpera: "", modoOpera: "normale",
      imp: { musica: 70, effetti: 80, lingua: linguaIniziale(), tema: "giungla", modo: "normale" },
      liv, cuccioli: 1, banane: 150, tasti: 0, tempo: 0, completate: 0,
      diario: [], ts: Date.now()
    };
  }

  // ---------- valori derivati ----------
  const moltStruttura = id => Math.pow(2, SOGLIE.filter(s => G.liv[id] >= s).length);
  const prodotto = gruppo => POT.filter(p => p.tipo === "unico" && p.gruppo === gruppo && G.liv[p.id]).reduce((m, p) => m * p.molt, 1);
  const scimmieBase = () => SCIMMIE_INIZIALI + STRUTTURE.reduce((s, [id, , dim]) => s + G.liv[id] * dim * moltStruttura(id), 0);
  const moltScimmie = () => prodotto("scimmie");
  const numScimmie = () => scimmieBase() * moltScimmie() * G.cuccioli;
  const numTraguardi = () => Object.keys(G.traguardi).length;
  const daRiscuotere = () => TRAGUARDI.filter(tr => G.traguardi[tr.id] && !G.traguardi[tr.id].r);
  const moltVelocita = () => MIGLIORAMENTI.reduce((m, [id, , molt]) => m * Math.pow(molt, G.liv[id] || 0), 1);
  const tastiOggetti = () => OGGETTI.reduce((s, [id, , agg]) => s + (G.liv[id] || 0) * agg, 0);
  const velocitaScimmia = () => (VELOCITA_BASE + tastiOggetti()) * moltVelocita();
  const tastiAlSecondo = () => numScimmie() * velocitaScimmia();
  const crescitaAlSecondo = () => G.liv.asilo / 100 / 3600;
  // le banane crescono meno che proporzionalmente ai tasti: tengono l'economia sotto controllo
  // Ogni lettera giusta battuta da una scimmia vale una banana (due in Realistica, dove azzeccarla è più difficile).
  // In media una lettera su "nTasti" è quella giusta, quindi le banane al secondo sono i tasti al secondo diviso i tasti della tastiera.
  const valoreLettera = () => (modoCorrente() === "realistica" ? 2 : 1);
  const bananeAlSecondo = (tps = tastiAlSecondo()) => tps / ((R && R.nTasti) || 27) * valoreLettera();
  // tutto ciò che le scimmie guadagnano battendo lettere giuste finisce nel "raccolto"
  function raccogli(banane) { G.banane += banane; G.raccolto += banane; G.lettere += banane / valoreLettera(); }
  const efficienzaNotte = (l = G.liv.notte) => 0.5 + 0.1 * l;
  const oreOffline = (l = G.liv.assenza) => 12 + 6 * l;
  // nuovo record: 25 banane per ogni lettera del record (es. record di 4 lettere = 100 banane)
  const bonusRecord = (da, a) => { let b = 0; for (let k = da + 1; k <= a; k++) b += 25 * k; return b; };
  // traguardo: una percentuale di tutte le banane raccolte finora dalle scimmie
  const premioTraguardo = tr => Math.max(G.raccolto * tr.pct / 100, tr.min || 1000);

  // ---------- costi ----------
  function costoPer(p, n) {
    if (p.tipo === "unico") return p.prezzo;
    const l = G.liv[p.id], r = p.rapporto;
    return Math.ceil(p.base * Math.pow(r, l) * (Math.pow(r, n) - 1) / (r - 1));
  }
  function quantiDaComprare(p) {
    const l = G.liv[p.id];
    const rimasti = p.max !== undefined ? p.max - l : Infinity;
    if (rimasti <= 0) return 0;
    if (p.tipo === "unico") return 1;
    if (G.qta === "max") {
      const r = p.rapporto, c0 = p.base * Math.pow(r, l);
      const n = Math.floor(Math.log(1 + G.banane * (r - 1) / c0) / Math.log(r));
      return Math.max(1, Math.min(rimasti, n));
    }
    return Math.min(rimasti, +G.qta);
  }

  function compra(p, ripetuto = false) {
    const n = quantiDaComprare(p);
    if (n <= 0) return false;
    const c = costoPer(p, n);
    if (G.banane < c) { if (!ripetuto) Suono.nego(); return false; }
    G.banane -= c;
    G.liv[p.id] += n;
    // tenendo premuto, il suono dell'acquisto suona al massimo ogni 120 millisecondi
    const adesso = performance.now();
    if (!ripetuto || adesso - (R.ultimoSuonoAcquisto || 0) > 120) {
      Suono.compra();
      R.ultimoSuonoAcquisto = adesso;
    }
    p.el.classList.remove("comprato"); void p.el.offsetWidth; p.el.classList.add("comprato");
    sincronizzaTelecamera();
    controllaTraguardi();
    disegnaNegozio();
    return true;
  }

  // Tieni premuto per comprare di continuo: parte dopo mezzo secondo e accelera.
  // Si ferma quando sollevi il dito, quando lo sposti (per scorrere) o quando finiscono le banane.
  function tieniPremuto(el, azione) {
    let timer = null, ripetizioni = 0, x0 = 0, y0 = 0;
    const ferma = () => { clearTimeout(timer); timer = null; el.classList.remove("premuto"); };
    const passo = ritardo => {
      if (!azione(true)) { ferma(); return; }
      ripetizioni++;
      timer = setTimeout(() => passo(Math.max(40, ritardo * 0.85)), ritardo);
    };
    el.addEventListener("pointerdown", e => {
      if (passoTut >= 0 || (e.pointerType === "mouse" && e.button !== 0)) return;
      ripetizioni = 0; x0 = e.clientX; y0 = e.clientY;
      clearTimeout(timer);
      el.classList.add("premuto");
      timer = setTimeout(() => passo(180), 450);
    });
    el.addEventListener("pointermove", e => { if (timer && Math.hypot(e.clientX - x0, e.clientY - y0) > 12) ferma(); });
    for (const ev of ["pointerup", "pointerleave", "pointercancel"]) el.addEventListener(ev, ferma);
    // se ha già comprato tenendo premuto, il tocco finale non deve comprarne un altro
    el.addEventListener("click", e => {
      if (ripetizioni > 0) { e.stopImmediatePropagation(); e.preventDefault(); ripetizioni = 0; }
    }, true);
    el.addEventListener("contextmenu", e => e.preventDefault());
  }

  // =====================================================================
  //  OPERA
  // =====================================================================
  function operaCorrente(id = G.operaId, lingua = L) {
    if (id === "mio") return { id: "mio", titolo: t("mio_titolo"), autore: null, testo: G.testoMio };
    const o = OPERE.find(x => x.id === id) || OPERE[0];
    return { ...o, titolo: (o.titoli && o.titoli[lingua]) || o.titolo, testo: (o.testi && o.testi[lingua]) || o.testo };
  }
  // i record delle opere tradotte si tengono separati per lingua (il testo cambia)
  function chiaveOpera(id, lingua, modo = modoCorrente()) {
    const o = OPERE.find(x => x.id === id);
    return (o && o.testi ? id + "@" + lingua : id) + (modo === "normale" ? "" : "#" + modo);
  }
  // se il giocatore ha cambiato lingua o difficoltà, il record in corso passa al testo nuovo
  // (quello vecchio resta salvato e torna se si rimette la lingua o la difficoltà di prima)
  function allinea() {
    const modo = modoCorrente();
    const daL = G.linguaOpera || L, daM = G.modoOpera || modo;
    if (daL === L && daM === modo) return;
    if (G.operaId === "mio") {
      if (normalizza(G.testoMio, daM) !== normalizza(G.testoMio, modo)) { G.record = 0; G.recordChi = 0; G.recordTs = 0; }
    } else if (normalizza(operaCorrente(G.operaId, daL).testo, daM) !== normalizza(operaCorrente(G.operaId, L).testo, modo)) {
      G.archivio[chiaveOpera(G.operaId, daL, daM)] = { record: G.record, chi: G.recordChi, ts: G.recordTs };
      const a = G.archivio[chiaveOpera(G.operaId, L, modo)];
      G.record = a ? a.record : 0; G.recordChi = a ? a.chi : 0; G.recordTs = a ? a.ts : 0;
    }
    G.linguaOpera = L;
    G.modoOpera = modo;
  }
  const autoreDi = o => o.id === "mio" ? t("mio_autore") : autoreOpera(o);

  function caricaOpera() {
    if (!R.fermo) allinea();
    const op = operaCorrente();
    R.target = normalizza(op.testo) || normalizza("Eureka");
    R.alfa = ALFABETI[scrittura(R.target)][modoCorrente()];
    R.confini = confiniParole();
    // a ogni cambio di frase la cronaca ricomincia da capo
    if (G.diarioTarget !== undefined && G.diarioTarget !== R.target) { G.diario = []; R.diarioSporco = true; }
    G.diarioTarget = R.target;
    R.nTasti = R.alfa.length;
    R.codici = Uint8Array.from(R.target, c => Math.max(0, R.alfa.indexOf(c)));
    R.fail = tabellaFallimento(R.codici);
    if (G.record >= R.target.length) { G.record = 0; G.recordChi = 0; G.recordTs = 0; }
    for (const s of R.cam) { s.k = 0; s.carta = ""; }
    R.extra = new Map();
    if (R.sel) chiudiScimmia();
    R.capo = { id: 1, k: 0, resto: 0 };
    scriviTitoloOpera();
  }
  function scriviTitoloOpera() {
    const op = operaCorrente();
    $("titoloOpera").textContent = op.titolo;
    const modo = modoCorrente();
    $("infoOpera").textContent = t("info_opera", { autore: autoreDi(op), car: caratteri(R.target.length) }) +
      (modo === "normale" ? "" : ", " + ICONE_MODO[modo] + " " + t("modo_" + modo).toLowerCase());
  }

  function nuovoRecord(k, chi, ts = Date.now()) {
    if (k <= G.record) return;
    const lung = R.target.length;
    k = Math.min(k, lung);
    const premioRec = bonusRecord(G.record, k);
    const vecchio = G.record;
    G.banane += premioRec;
    G.record = k;
    G.recordChi = chi;
    G.recordTs = ts;
    aggiungiDiario({ tipo: "record", chi, n: k, testo: R.target.slice(Math.max(0, k - 40), k) });
    paroleCompletate(vecchio, k, chi);
    if (k >= lung) { operaCompletata(chi); return; }
    if (!R.caricamento) {
      Suono.record();
      avviso(t("rec_nuovo", { car: caratteri(k) }) + " +" + fmt(premioRec) + " 🍌");
      const el = $("tRecord");
      el.classList.remove("festa"); void el.offsetWidth; el.classList.add("festa");
    }
    Online.pubblicaRiga();
  }

  function operaCompletata(chi) {
    if (R.fermo) return;
    R.fermo = true;
    R.vincitrice = chi;
    const primaVolta = G.operaId !== "mio" && !G.opereFatte.includes(G.operaId);
    if (primaVolta) G.opereFatte.push(G.operaId);
    if (G.operaId === "mio") { if (R.target.length > (G.fraseMio || 0)) { G.fraseMio = R.target.length; G.fraseMioModo = modoCorrente(); } }
    else if (R.target.length > (G.lunghe[G.operaId] || 0)) { G.lunghe[G.operaId] = R.target.length; G.lungheModo[G.operaId] = modoCorrente(); }
    const fm = (G.frasiModo = G.frasiModo || {})[modoCorrente()] = G.frasiModo[modoCorrente()] || {};
    fm[G.operaId] = Math.max(fm[G.operaId] || 0, R.target.length);
    // un editore compra l'opera: metà del raccolto la prima volta, un decimo le volte successive
    const premio = Math.max(G.raccolto * (primaVolta ? 0.2 : 0.05), R.target.length * (primaVolta ? 1000 : 100));
    G.banane += premio;
    G.completate++;
    if (G.operaId !== "mio") G.archivio[chiaveOpera(G.operaId, G.linguaOpera || L, G.modoOpera || modoCorrente())] = { record: 0, chi: 0, ts: 0 };
    aggiungiDiario({ tipo: "opera", chi, operaId: G.operaId });
    R.premioFine = premio;
    R.primaVoltaFine = primaVolta;
    const prossima = OPERE.find(o => !G.opereFatte.includes(o.id)) || OPERE[OPERE.length - 1];
    R.prossima = prossima.id;
    scriviFinestraFine();
    controllaTraguardi();
    chiudi("veloBiblioteca"); chiudi("veloRitorno");
    apri("veloFine");
    Suono.fine();
    salva();
    Online.salvaOnline();
    Online.pubblicaRiga();
  }
  function scriviFinestraFine() {
    if (!R.fermo) return;
    const op = operaCorrente();
    $("testoFine").innerHTML =
      t("fine_testo", { chi: chiScimmia(R.vincitrice), n: fmt(R.target.length), titolo: op.titolo }) +
      t(R.primaVoltaFine ? "fine_premio" : "fine_premio_rid", { n: fmt(R.premioFine || 0) });
    $("bProssima").textContent = t("inizia", { titolo: operaCorrente(R.prossima).titolo });
  }

  // Cambiando opera il record di quella lasciata resta in archivio
  function iniziaOpera(id, testo) {
    if (!R.fermo && G.operaId !== "mio") {
      G.archivio[chiaveOpera(G.operaId, G.linguaOpera || L, G.modoOpera || modoCorrente())] = { record: G.record, chi: G.recordChi, ts: G.recordTs };
    }
    G.operaId = id;
    G.linguaOpera = L;
    G.modoOpera = modoCorrente();
    if (testo !== undefined) G.testoMio = testo;
    const a = id !== "mio" && G.archivio[chiaveOpera(id, L)];
    G.record = a ? a.record : 0;
    G.recordChi = a ? a.chi : 0;
    G.recordTs = a ? a.ts : 0;
    R.fermo = false; R.vincitrice = 0;
    chiudi("veloFine"); chiudi("veloBiblioteca");
    caricaOpera();
    salva();
  }

  // =====================================================================
  //  SIMULAZIONE
  //  Le scimmie mostrate sono simulate tasto per tasto; tutte le altre, che possono
  //  essere miliardi, con la statistica: ogni tasto è giusto con probabilità 1/27.
  // =====================================================================
  const idCasuale = N => 1 + Math.floor(Math.random() * Math.max(1, Math.floor(N)));

  // =====================================================================
  //  PAROLE DELLA FRASE: contano solo nell'ordine giusto, cioè quando la scimmia in testa
  //  completa una parola mentre scrive la frase dall'inizio. Più la parola è lunga, più vale.
  // =====================================================================
  // dove finisce ogni parola della frase (non l'ultima: finire l'ultima vuol dire completare la frase)
  function confiniParole() {
    const confini = [];
    if (modoCorrente() === "facile") {
      // in Facile gli spazi non si battono: le parole si ricavano dal testo con gli spazi
      let pos = 0;
      for (const w of normalizza(operaCorrente().testo, "normale").split(" ")) {
        pos += w.length;
        if (w.length >= 2 && pos < R.target.length) confini.push({ fine: pos, parola: w });
      }
    } else {
      let inizio = 0;
      for (let j = 0; j <= R.target.length; j++) {
        if (j === R.target.length || R.target[j] === " ") {
          const w = R.target.slice(inizio, j).replace(/[^\p{L}]/gu, "");
          if ([...w].length >= 2 && j < R.target.length) confini.push({ fine: j, parola: w });
          inizio = j + 1;
        }
      }
    }
    return confini;
  }
  // premio di una parola: 50 × lettere², oppure 30 secondi di banane per lettera se è di più
  const premioParola = lung => Math.max(50 * lung * lung, 30 * lung * bananeAlSecondo());
  function paroleCompletate(da, a, chi) {
    let totale = 0, ultima = null;
    for (const c of R.confini || []) {
      if (c.fine <= da || c.fine > a) continue;
      const lung = [...c.parola].length;
      totale += premioParola(lung);
      G.parole = (G.parole || 0) + 1;
      if (!G.parolaMax || lung > G.parolaMax.l) G.parolaMax = { p: c.parola, l: lung };
      const modo = modoCorrente();
      G.paroleModo = G.paroleModo || {};
      if (!G.paroleModo[modo] || lung > G.paroleModo[modo].l) G.paroleModo[modo] = { p: c.parola, l: lung };
      aggiungiDiario({ tipo: "parola", chi, w: c.parola, n: lung });
      ultima = c;
    }
    if (!ultima) return;
    G.banane += totale;
    if (!R.caricamento) avviso(t("parola_trovata", { chi: chiScimmia(chi), w: ultima.parola, n: fmt(totale) }));
  }

  function serieMassimaSuTasti(K) {
    const P_GIUSTO = 1 / R.nTasti;
    const tentativi = K * (1 - P_GIUSTO);
    if (tentativi <= 0) return 0;
    const u = Math.random() || 1e-12;
    const x = -Math.expm1(Math.log(u) / tentativi);
    if (x <= 0) return R.target.length;
    return Math.max(0, Math.floor(Math.log(x) / Math.log(P_GIUSTO)));
  }
  function serieInCorsoMassima(N) {
    const P_GIUSTO = 1 / R.nTasti;
    const u = Math.random() || 1e-12;
    const x = -Math.expm1(Math.log(u) / Math.max(1, N));
    if (x <= 0) return R.target.length;
    return Math.max(0, Math.floor(Math.log(x) / Math.log(P_GIUSTO)));
  }

  function sincronizzaTelecamera() {
    const n = Math.min(TELECAMERA, Math.floor(numScimmie()));
    while (R.cam.length < n) R.cam.push({ k: 0, carta: "", resto: 0 });
  }

  // Una scimmia batte i suoi tasti; k = caratteri giusti di fila
  function battiScimmia(sc, id, passi, massimo) {
    const tg = R.codici, f = R.fail;
    const tot = passi + sc.resto;
    let n = Math.floor(tot);
    sc.resto = tot - n;
    if (n > massimo) { n = massimo; sc.resto = 0; }
    const osservata = sc === R.selStato;
    const tieni = osservata ? 400 : 30;
    let k = sc.k, migliore = sc.migliore || 0, coda = "";
    for (let j = 0; j < n; j++) {
      const c = tasto();
      if (n - j <= tieni) coda += R.alfa[c];
      if (c === tg[k]) {
        k++;
        if (k > migliore) migliore = k;
        if (k > G.record) { nuovoRecord(k, id); if (R.fermo) break; }
      } else {
        while (k > 0 && tg[k] !== c) k = f[k - 1];
        if (tg[k] === c) k++;
      }
    }
    sc.k = k;
    sc.migliore = migliore;
    sc.battuti = (sc.battuti || 0) + n;
    if (coda) {
      sc.carta = (sc.carta + coda).slice(-30);
      if (osservata) sc.storia = (sc.storia + coda).slice(-1500);
    }
  }

  function muoviTelecamera(passiPerScimmia) {
    for (let i = 0; i < R.cam.length && !R.fermo; i++) battiScimmia(R.cam[i], i + 1, passiPerScimmia, MAX_PASSI_FRAME);
  }

  // stato di una scimmia qualsiasi: le prime 40 sono sempre seguite, le altre quando sono sullo schermo
  function statoScimmia(id) {
    if (id <= R.cam.length) return R.cam[id - 1];
    let sc = R.extra.get(id);
    if (!sc) { sc = { k: 0, carta: "", resto: 0 }; R.extra.set(id, sc); }
    return sc;
  }
  function muoviVisibili(passi) {
    for (const id of R.visibili) {
      if (R.fermo) return;
      if (id > R.cam.length) battiScimmia(statoScimmia(id), id, passi, 400);
    }
  }

  function muoviCapo(passi, N) {
    const tg = R.codici, lung = tg.length;
    const tot = passi + R.capo.resto;
    let n = Math.floor(tot);
    R.capo.resto = tot - n;
    if (n > MAX_PASSI_FRAME) { n = MAX_PASSI_FRAME; R.capo.resto = 0; }
    for (let j = 0; j < n && !R.fermo; j++) {
      if (tasto() === tg[R.capo.k]) {
        R.capo.k++;
        if (R.capo.k > G.record) nuovoRecord(R.capo.k, R.capo.id);
      } else {
        R.capo.k = Math.min(G.record, lung - 1, serieInCorsoMassima(N));
        R.capo.id = idCasuale(N);
      }
    }
  }

  function passo(dt) {
    if (R.fermo) return;
    G.tempo += dt;
    const g = crescitaAlSecondo();
    if (g > 0) G.cuccioli *= Math.exp(g * dt);
    const N = numScimmie(), v = velocitaScimmia();
    G.tasti += N * v * dt;
    raccogli(bananeAlSecondo(N * v) * dt);
    sincronizzaTelecamera();
    muoviTelecamera(v * dt);
    if (R.fermo) return;
    muoviVisibili(v * dt);
    // la scimmia aperta nella scheda continua a scrivere anche se la sua scrivania è fuori schermo
    if (R.sel > R.cam.length && !R.visibili.has(R.sel) && !R.fermo) battiScimmia(R.selStato, R.sel, v * dt, 400);
    if (R.fermo) return;
    if (N > TELECAMERA) {
      const migliore = serieMassimaSuTasti((N - R.cam.length) * v * dt);
      if (migliore > G.record) nuovoRecord(migliore, idCasuale(N));
      if (!R.fermo) muoviCapo(v * dt, N);
    }
  }

  function scimmiaInTesta() {
    let id = 0, k = -1;
    R.cam.forEach((s, i) => { if (s.k > k) { k = s.k; id = i + 1; } });
    if (numScimmie() > TELECAMERA && R.capo.k > k) { k = R.capo.k; id = R.capo.id; }
    return { id, k: Math.max(0, k) };
  }

  // =====================================================================
  //  TRAGUARDI
  // =====================================================================
  function controllaTraguardi() {
    let nuovi = 0;
    for (const tr of TRAGUARDI) {
      if (G.traguardi[tr.id]) continue;
      if (tr.val() >= tr.obiettivo) {
        G.traguardi[tr.id] = { r: false };
        nuovi++;
        if (!R.caricamento) avviso(t("trag_avviso", { nome: tr.nome() }), "oro");
      }
    }
    if (nuovi && !R.caricamento) Suono.traguardo();
  }
  // scheda del negozio: Scimmie, Velocità o Altro
  function mostraGruppo(g) {
    R.gruppo = g;
    document.querySelectorAll(".segmenti button[data-gruppo]").forEach(x => x.setAttribute("aria-pressed", x.dataset.gruppo === g));
    for (const k of ["scimmie", "velocita", "altro"]) $("lista-" + k).hidden = k !== g;
    disegnaNegozio();
  }
  function riscuoti(tr) {
    const stato = G.traguardi[tr.id];
    if (!stato || stato.r) return 0;
    const premio = premioTraguardo(tr);
    G.banane += premio;
    stato.r = true;
    return premio;
  }

  // =====================================================================
  //  DISEGNO
  // =====================================================================
  function disegnaHud() {
    $("hBanane").textContent = fmt(G.banane);
    $("hBananeS").textContent = t("al_sec", { n: fmtDec(bananeAlSecondo()) });
    $("hTasti").textContent = fmt(tastiAlSecondo()) + "/s";
  }

  function disegnaOpera() {
    const tg = R.target, lung = tg.length;
    const testa = R.fermo ? { id: R.vincitrice, k: lung } : scimmiaInTesta();
    const k = testa.k, rec = Math.max(G.record, k);
    const box = $("manoscritto");
    box.innerHTML =
      `<span>${tg.slice(0, k)}</span><span class="cursore" id="cursore"></span>` +
      `<span class="record">${tg.slice(k, rec)}</span><span class="resto">${tg.slice(rec)}</span>`;
    const cur = $("cursore");
    if (cur && box.offsetParent) {
      const y = cur.offsetTop;
      if (y < box.scrollTop + 10 || y > box.scrollTop + box.clientHeight - 40) box.scrollTop = Math.max(0, y - box.clientHeight / 2);
    }
    $("barraOra").style.width = (100 * k / lung) + "%";
    $("barraRec").style.width = (100 * G.record / lung) + "%";
    $("tRecord").textContent = t("chip_record", { r: G.record, l: lung });
    $("tQuando").textContent = G.recordTs ? "🕒 " + fmtFa(G.recordTs) : t("chip_nessun");
    $("tChi").textContent = R.fermo ? t("chip_fatta") : (k ? t("chip_scimmia", { id: fmtId(testa.id) }) : t("chip_ricominciano"));
    $("oScimmie").textContent = fmt(numScimmie());
    $("oVel").textContent = fmtDec(velocitaScimmia());
    $("oCuccioli").textContent = G.liv.asilo ? "+" + G.liv.asilo + "%" : "—";
    disegnaDiarioInfo();
  }

  const visibile = p => !(p.tipo === "unico" && G.liv[p.id] >= 1) && (!p.vis || p.vis() || G.liv[p.id] > 0);

  function costruisciNegozio() {
    for (const p of POT) {
      const b = document.createElement("button");
      b.className = "pot" + (p.tipo === "unico" ? " speciale" : "");
      b.innerHTML =
        `<span class="ico">${p.icona}</span>` +
        `<span class="corpo"><span class="nome"><span class="n"></span><span class="possesso"></span></span><span class="effetto"></span><span class="soglia"></span></span>` +
        `<span class="prezzo"><span class="q"></span><span class="c"></span></span><span class="riempi"></span>`;
      b.onclick = () => compra(p);
      tieniPremuto(b, ripetuto => compra(p, ripetuto));
      p.el = b;
      $(p.sezione || "lista-" + p.gruppo).appendChild(b);
    }
  }

  function disegnaNegozio() {
    for (const p of POT) {
      const vis = visibile(p);
      p.el.hidden = !vis;
      if (!vis || p.gruppo !== R.gruppo) continue;
      const alMax = p.max !== undefined && G.liv[p.id] >= p.max;
      const n = quantiDaComprare(p);
      const c = alMax ? 0 : costoPer(p, Math.max(1, n));
      const caro = !alMax && G.banane < c;
      p.el.querySelector(".n").textContent = nomePot(p.id);
      p.el.querySelector(".possesso").textContent =
        p.tipo === "struttura" || p.tipo === "oggetto" ? fmt(G.liv[p.id]) : p.tipo === "unico" ? t("unico") : t("liv", { l: G.liv[p.id] + (p.max ? "/" + p.max : "") });
      p.el.querySelector(".effetto").textContent = p.effetto();
      p.el.querySelector(".soglia").textContent = p.soglia ? p.soglia() : "";
      p.el.querySelector(".q").textContent = alMax ? "" : caro
        ? t("tra", { t: fmtBreve((c - G.banane) / Math.max(1e-9, bananeAlSecondo())) })
        : (p.tipo === "unico" ? t("compra1") : t("compraN", { n }));
      p.el.querySelector(".c").textContent = alMax ? t("completo") : fmt(c) + " 🍌";
      p.el.querySelector(".riempi").style.width = alMax ? "0" : Math.min(100, 100 * G.banane / c) + "%";
      p.el.classList.toggle("caro", caro);
      p.el.classList.toggle("completo", alMax);
      p.el.disabled = alMax;
    }
    const presi = POT.filter(p => p.tipo === "unico" && p.gruppo === R.gruppo && G.liv[p.id]).map(p => p.icona + " " + nomePot(p.id));
    $("presi").textContent = presi.length ? t("presi", { lista: presi.join(", ") }) : "";
    $("riassunto").textContent = R.gruppo === "scimmie"
      ? scimmieN(numScimmie()) + (moltScimmie() > 1 ? t("riass_bonus", { m: fmt(moltScimmie()) }) : "") + (G.cuccioli > 1.01 ? t("riass_cuccioli", { c: fmtDec(G.cuccioli) }) : "")
      : R.gruppo === "velocita" ? t("riass_vel", { v: fmtDec(velocitaScimmia()) }) : t("riass_altro");
  }

  function disegnaBadge() {
    const pronto = g => POT.some(p => p.gruppo === g && visibile(p) && !(p.max !== undefined && G.liv[p.id] >= p.max) && G.banane >= costoPer(p, 1));
    const ps = pronto("scimmie"), pv = pronto("velocita"), pa = pronto("altro");
    $("pScimmie").classList.toggle("vis", ps);
    $("pVelocita").classList.toggle("vis", pv);
    $("pAltro").classList.toggle("vis", pa);
    $("badgeNegozio").classList.toggle("vis", ps || pv || pa);
    const n = daRiscuotere().length;
    $("badgeTrag").textContent = n;
    $("badgeTrag").classList.toggle("vis", n > 0);
  }

  function cartaHtml(testo, k) {
    const giusti = Math.min(k, testo.length);
    return testo.slice(0, testo.length - giusti) + (giusti ? "<mark>" + testo.slice(testo.length - giusti) + "</mark>" : "");
  }

  function disegnaScimmie() {
    const rec = G.record, lung = R.target.length;
    $("cNome").textContent = rec ? "🐒 " + chiScimmia(G.recordChi) : t("c_nessuna");
    $("cQuando").textContent = rec ? fmtFa(G.recordTs) : "";
    $("cCarta").innerHTML = rec ? "<mark>" + R.target.slice(0, rec) + "</mark>" : t("c_vuoto");
    $("cRecord").textContent = t("di", { r: rec, car: caratteri(lung), l: lung });
    $("cData").textContent = rec ? fmtData(G.recordTs) : "—";

    // l'ufficio si allunga man mano che scorri verso il basso
    const totale = Math.floor(numScimmie());
    const sentinella = $("fineUfficio");
    if (sentinella.getBoundingClientRect && sentinella.getBoundingClientRect().top < (window.innerHeight || 800) + 600) caricaAltre();
    $("sConteggio").textContent = scimmieN(totale);
    const mancanti = totale - R.schede.length;
    sentinella.textContent = mancanti <= 0 ? ""
      : R.schede.length >= LIMITE_UFFICIO ? t("ufficio_altri", { n: fmt(mancanti) }) : t("scorri");
  }

  // ---------- l'ufficio: una scrivania per ogni scimmia ----------
  const LIMITE_UFFICIO = 1000;
  let osservatore = null;
  function preparaUfficio() {
    $("ufficio").innerHTML = "";
    if (osservatore) osservatore.disconnect();
    osservatore = typeof IntersectionObserver !== "undefined"
      ? new IntersectionObserver(voci => {
          for (const v of voci) {
            const id = +v.target.dataset.id;
            if (v.isIntersecting) R.visibili.add(id); else R.visibili.delete(id);
          }
        }, { rootMargin: "80px" })
      : null;
  }
  function caricaAltre() {
    const totale = Math.min(LIMITE_UFFICIO, Math.floor(numScimmie()));
    const fino = Math.min(totale, R.schede.length + 36);
    const box = $("ufficio");
    for (let id = R.schede.length + 1; id <= fino; id++) {
      const el = document.createElement("div");
      el.className = "scrivania";
      el.dataset.id = id;
      el.onclick = () => { Suono.clic(); apriScimmia(id); };
      el.innerHTML = `<canvas width="40" height="30"></canvas>` +
        `<div class="targa">n°${fmtId(id)}<span></span></div><div class="carta-s"><bdi></bdi></div>`;
      box.appendChild(el);
      const cv = el.querySelector("canvas");
      if (cv.setAttribute) cv.setAttribute("aria-label", t("aria_scrivania", { id: fmtId(id) }));
      R.schede.push({ id, el, ctx: cv.getContext ? cv.getContext("2d") : null, targa: el.querySelector(".targa span"), carta: el.querySelector("bdi") });
      if (osservatore) osservatore.observe(el);
      else if (id <= 8) R.visibili.add(id);
    }
  }
  function disegnaUfficio(ora) {
    for (const sch of R.schede) {
      if (!R.visibili.has(sch.id)) continue;
      const sc = statoScimmia(sch.id);
      if (sch.ctx) disegnaScrivania(sch.ctx, sch.id, ora, R.fermo);
      const re = G.record > 0 && sch.id === G.recordChi;
      sch.el.classList.toggle("re", re);
      sch.targa.textContent = re ? "👑" : sc.k ? "⭐" + sc.k : "";
      sch.carta.innerHTML = cartaHtml(sc.carta.slice(-16), sc.k);
    }
  }

  // ---------- una scimmia da vicino ----------
  function apriScimmia(id) {
    R.sel = id;
    R.selStato = statoScimmia(id);
    R.selStato.storia = R.selStato.carta;
    apri("veloScimmia");
    disegnaSchedaScimmia(performance.now());
  }
  function chiudiScimmia() {
    if (R.selStato) R.selStato.storia = "";
    R.sel = 0; R.selStato = null;
    chiudi("veloScimmia");
  }
  function disegnaSchedaScimmia(ora) {
    const sc = R.selStato, id = R.sel;
    if (!sc) return;
    const cv = $("cvScimmia");
    if (cv.getContext) disegnaScrivania(cv.getContext("2d"), id, ora, R.fermo);
    const re = G.record > 0 && id === G.recordChi;
    $("titScimmia").textContent = chiScimmia(id) + (re ? " 👑" : "");
    $("sottoScimmia").textContent = re ? t("scheda_re", { car: caratteri(G.record) }) : t("scheda_vel", { v: fmtDec(velocitaScimmia()) });

    const testo = sc.storia || sc.carta;
    const giusti = Math.min(sc.k, testo.length);
    const pagina = $("paginaScimmia");
    const inFondo = pagina.scrollHeight - pagina.scrollTop - pagina.clientHeight < 30;
    pagina.innerHTML = testo.slice(0, testo.length - giusti) + (giusti ? "<mark>" + testo.slice(testo.length - giusti) + "</mark>" : "") + '<span class="cursore"></span>';
    if (inFondo) pagina.scrollTop = pagina.scrollHeight;

    const tg = R.target, k = Math.min(sc.k, tg.length);
    const resto = tg.length > k + 24 ? tg.slice(k, k + 24) + "…" : tg.slice(k);
    $("obiettivoScimmia").innerHTML = `<b>${tg.slice(0, k)}</b>${resto}`;
    $("msOra").textContent = fmt(sc.k);
    $("msMax").textContent = fmt(Math.max(sc.migliore || 0, re ? G.record : 0));
    $("msTasti").textContent = fmt(sc.battuti || 0);
  }

  // ---------- traguardi ----------
  function costruisciTraguardi() {
    const g = $("grigliaTrag");
    for (const tr of TRAGUARDI) {
      const d = document.createElement("div");
      d.className = "trag bloccato";
      d.innerHTML = `<span class="ico">${tr.ico}</span><b></b><small class="desc"></small>` +
        `<span class="premio"></span><div class="avanz"><div></div></div>` +
        `<button class="riscuoti"></button><span class="fatto"></span>`;
      d.querySelector(".riscuoti").onclick = () => {
        const premio = riscuoti(tr);
        if (premio) { Suono.moneta(); avviso(t("riscosso", { n: fmt(premio) })); }
        disegnaTraguardi(); disegnaBadge();
      };
      tr.el = d;
      g.appendChild(d);
    }
  }
  function disegnaTraguardi() {
    for (const tr of TRAGUARDI) {
      const s = G.traguardi[tr.id];
      tr.el.classList.toggle("bloccato", !s);
      tr.el.classList.toggle("pronto", !!s && !s.r);
      tr.el.classList.toggle("riscosso", !!s && s.r);
      tr.el.querySelector("b").textContent = tr.nome();
      tr.el.querySelector(".desc").textContent = tr.desc();
      tr.el.querySelector(".fatto").textContent = t("premio_riscosso");
      tr.el.querySelector(".premio").textContent = s && s.r ? "" : (s ? t("premio_pct", { p: tr.pct, n: fmt(premioTraguardo(tr)) }) : t("premio_pct_breve", { p: tr.pct, m: fmt(tr.min || 1000) }));
      if (s && !s.r) tr.el.querySelector(".riscuoti").textContent = t("riscuoti", { n: fmt(premioTraguardo(tr)) });
      if (!s) {
        const v = tr.val(), o = tr.obiettivo;
        const frazione = o >= 1000 ? Math.log10(Math.max(1, v)) / Math.log10(o) : v / o;
        tr.el.querySelector(".avanz div").style.width = Math.max(0, Math.min(100, 100 * frazione)) + "%";
      }
    }
    const n = daRiscuotere().length;
    $("bRiscuotiTutto").hidden = n < 2;
    $("tagRiassunto").textContent = t("tag_ries", { a: numTraguardi(), b: TRAGUARDI.length }) + (n ? t("tag_premi", { n }) : "");
  }

  // ---------- diario ----------
  function disegnaDiarioInfo() {
    const lung = R.target.length;
    $("dRecord").textContent = t("di", { r: G.record, car: caratteri(lung), l: lung }) +
      (G.record && G.recordChi ? t("d_scimmia", { id: fmtId(G.recordChi) }) : "");
    $("dQuando").textContent = G.recordTs ? `${fmtFa(G.recordTs)} (${fmtData(G.recordTs)})` : "—";
    const lRate = Math.log10(Math.max(1e-9, tastiAlSecondo()));
    const lTasti = Math.log10(R.nTasti);

    $("dProssimo").textContent = R.fermo || ferme ? "—" : fmtTempoLog((G.record + 1) * lTasti - lRate);
    $("dAttesa").textContent = R.fermo ? t("fatto") : ferme ? "—" : fmtTempoLog(lung * lTasti - lRate);
  }
  function disegnaStatistiche() {
    $("sTasti").textContent = fmt(G.tasti);
    $("sTempo").textContent = fmtTempo(G.tempo);
    $("sOpere").textContent = G.opereFatte.length;
    $("sMax").textContent = caratteri(recordMassimo());
    $("sLettere").textContent = fmt(G.lettere);
    $("sRaccolto").textContent = fmt(G.raccolto);
    $("sParole").textContent = fmt(G.parole || 0);
    $("sParolaMax").textContent = G.parolaMax ? "«" + G.parolaMax.p + "»" : "—";
  }
  function aggiungiDiario(voce) {
    voce.quando = Date.now();
    G.diario.unshift(voce);
    G.diario.length = Math.min(G.diario.length, 60);
    R.diarioSporco = true;
  }
  function disegnaCronaca() {
    $("cronaca").innerHTML = G.diario.length
      ? G.diario.map(v => {
          const chi = chiScimmia(v.chi);
          const quando = `<small>${fmtFa(v.quando)}</small>`;
          if (v.tipo === "parola") return `<li>${t("cr_parola", { chi, w: v.w, car: caratteri(v.n) })}${quando}</li>`;

          }
          return `<li>${t("cr_record", { chi, car: caratteri(v.n) })} <q>${v.n > 40 ? "…" : ""}${v.testo}</q>${quando}</li>`;

      : `<li><small>${t("cr_vuoto")}</small></li>`;

  // ---------- biblioteca ----------
  function disegnaBiblioteca() {
    const box = $("listaOpere");
    box.innerHTML = "";
    for (const o of OPERE) {
      const loc = operaCorrente(o.id);
      const lung = normalizza(loc.testo).length;

      const corrente = o.id === G.operaId;
      const arc = G.archivio[chiaveOpera(o.id, L)];

      const b = document.createElement("button");
      b.className = "opera-riga" + (corrente ? " corrente" : "");
      b.innerHTML = `<b>${loc.titolo}</b><span class="stato ${fatta ? "fatta" : ""}">${fatta ? t("bib_fatta") : rec ? `⭐ ${rec}/${lung}` : ""}${corrente && !R.fermo ? "<br>" + t("bib_corso") : ""}</span><small>${autoreOpera(o)}, ${caratteri(lung)}</small>`;
